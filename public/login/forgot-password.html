<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên Mật Khẩu</title>
    <style>body{margin:0;padding:0;font-family:'Segoe UI',sans-serif;background:#f0f2f5;height:100vh;display:flex;align-items:center;justify-content:center}.card{background:white;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);width:100%;max-width:400px}.form-control{width:100%;padding:10px;margin-bottom:15px;border:1px solid #ddd;border-radius:6px;box-sizing:border-box}.btn{width:100%;padding:10px;background:#28a745;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold}.btn:hover{background:#218838}h3{text-align:center;color:#333}</style>
</head>
<body>
    <div class="card">
        <h3>YÊU CẦU ĐỔI MẬT KHẨU</h3>
        <p style="text-align:center;color:#666;font-size:14px;margin-bottom:20px">Nhập tên đăng nhập và mật khẩu mới. Admin sẽ duyệt yêu cầu của bạn.</p>
        <form id="reqForm">
            <input type="text" id="user" class="form-control" placeholder="Tên đăng nhập" required>
            <input type="password" id="newPass" class="form-control" placeholder="Mật khẩu mới mong muốn" required>
            <button type="submit" class="btn">Gửi Yêu Cầu</button>
        </form>
        <div style="text-align:center;margin-top:15px"><a href="login.html" style="text-decoration:none;color:#666">Quay lại</a></div>
    </div>
    <script>
        document.getElementById('reqForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('user').value;
            const p = document.getElementById('newPass').value;
            try {
                const res = await fetch('/api/auth/request-reset', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({username:u, newPassword:p}) });
                const data = await res.json();
                alert(data.message);
                if(res.ok) window.location.href = 'login.html';
            } catch(e) { alert('Lỗi kết nối'); }
        });
    </script>
</body>
</html>
