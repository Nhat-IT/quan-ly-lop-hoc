<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sinh Viên</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <script src="auth.js"></script> 
    
    <style>
        /* =========================================
           CẤU HÌNH CHUNG
           ========================================= */
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; padding-bottom: 60px; }

        /* Card thống kê */
        .stat-card { border: none; border-radius: 15px; background: white; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.2s; }
        .stat-card:hover { transform: translateY(-3px); }
        .icon-box { width: 55px; height: 55px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; flex-shrink: 0; }
        
        /* Bảng dữ liệu */
        .table-card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow: hidden; }
        .table-responsive { overflow-x: auto; }
        .table { margin-bottom: 0; }
        
        /* --- ĐỊNH DẠNG CỘT CHUNG --- */
        .table thead th, .table tbody td {
            vertical-align: middle;
            white-space: nowrap; 
            padding: 12px 8px;   
        }

        .table thead th {
            font-weight: 700; color: #495057; text-transform: uppercase; 
            font-size: 0.85rem; background-color: #f8f9fa; 
            border-bottom: 2px solid #dee2e6;
        }

        /* -----------------------------------------------------------
           CẤU HÌNH ĐỘ RỘNG CỘT (Dựa trên Header)
           ----------------------------------------------------------- */
        .table th:nth-child(1) { width: 5%; text-align: center; padding-left: 24px !important; } /* STT */
        .table th:nth-child(2) { width: 25%; text-align: left; padding-left: 30px !important; }  /* Họ tên */
        .table th:nth-child(3) { width: 25%; text-align: left; padding-left: 30px !important; }  /* Môn học */
        .table th:nth-child(4) { width: 100px; text-align: center; } /* Ngày */
        .table th:nth-child(5) { width: 80px; text-align: center; }  /* Buổi */
        .table th:nth-child(6) { width: 15%; text-align: center; }   /* Lý do */
        .table th:nth-child(7) { width: 80px; text-align: center; }  /* Minh chứng */
        .table th:last-child   { width: 80px; text-align: center; padding-right: 24px !important; } /* Vắng */

        /* -----------------------------------------------------------
           CẤU HÌNH CỘT DỮ LIỆU (Dùng class riêng để tránh lỗi rowspan)
           ----------------------------------------------------------- */
        .c-stt     { text-align: center; padding-left: 24px !important; font-weight: bold; color: #6c757d; }
        .c-name    { text-align: left; padding-left: 30px !important; }
        .c-sub     { text-align: left; padding-left: 30px !important; }
        .c-date    { text-align: center; font-family: 'Segoe UI', sans-serif; } /* Luôn căn giữa */
        .c-session { text-align: center; } /* Luôn căn giữa */
        .c-reason  { text-align: center; }
        .c-proof   { text-align: center; }
        .c-absent  { text-align: center; padding-right: 24px !important; }

        /* Badge tên môn học */
        .badge-sub { 
            background: #f8f9fa; border: 1px solid #dee2e6; 
            color: #495057; border-radius: 6px; 
            padding: 6px 10px; font-weight: 600; 
            display: inline-block;
            width: auto; max-width: calc(100% - 30px); 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;      
            vertical-align: middle; text-align: left;             
        }
        
        .btn-action { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid #dee2e6; background: white; color: #6c757d; transition: 0.2s; cursor: pointer; margin: 0 auto; }
        .btn-action:hover { transform: scale(1.1); color: #0d6efd; border-color: #0d6efd; }
        .alert-row { background-color: #fff5f5 !important; }
        .alert-row td:first-child { border-left: 5px solid #dc3545; }
        .detail-card { background: #fff3cd; border: 1px solid #ffeeba; border-radius: 12px; cursor: pointer; transition: 0.2s; }
        .detail-card:hover { background: #ffe69c; transform: translateY(-2px); }
        .editable-reason { position: relative; cursor: pointer; transition: background 0.2s; padding-right: 30px !important; }
        .editable-reason:hover { background-color: #fff3cd; }
        .edit-icon { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); opacity: 0; transition: opacity 0.2s; color: #0d6efd; }
        .editable-reason:hover .edit-icon { opacity: 1; }
        .delete-absence-icon { opacity: 0; transition: all 0.2s; cursor: pointer; color: #dc3545; margin-left: 8px; font-size: 0.9rem; }
        .subject-col:hover .delete-absence-icon { opacity: 1; }
        .subject-col:hover .delete-absence-icon:hover { transform: scale(1.2); }

        @media (max-width: 576px) {
            .navbar .container { padding-left: 10px; padding-right: 10px; }
            .stat-card { margin-bottom: 10px; }
            .btn span { display: none; } .btn i { margin: 0; }
            #semesterDisplay, #yearHeaderDisplay { display: none; }
            .table-card { padding: 10px; }
            .table th, .table td { padding-left: 10px !important; padding-right: 10px !important; }
            .badge-sub { max-width: 150px; }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-primary mb-4 shadow-sm sticky-top">
        <div class="container">
            <span class="navbar-brand fw-bold fs-5"><i class="fas fa-user-shield"></i> DASHBOARD</span>
            <div class="d-flex align-items-center gap-2">
                <div class="text-white small text-end d-none d-md-block">
                    <div id="semesterDisplay">Đang tải...</div>
                    <div id="yearHeaderDisplay" class="fw-bold text-warning">--</div> 
                </div>
                <div class="d-flex align-items-center text-white border-start border-white ps-3 ms-2" style="height: 35px;">
                    <div class="text-end lh-1 me-2">
                        <div class="fw-bold" id="userNameDisplay" style="font-size: 0.9rem;">--</div>
                    </div>
                    <i class="fas fa-user-circle fs-3"></i>
                </div>
                <div id="adminButtonPlaceholder"></div>
                <button class="btn btn-outline-light btn-sm fw-bold" onclick="performLogout()" title="Thoát">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row mb-4 g-3">
            <div class="col-12 col-md-4">
                <div class="card stat-card h-100">
                    <div class="card-body d-flex align-items-center">
                        <div class="icon-box bg-primary bg-opacity-10 text-primary me-3"><i class="fas fa-users"></i></div>
                        <div><h6 class="text-muted small fw-bold">TỔNG SINH VIÊN</h6><h3 class="fw-bold mb-0" id="totalCount">--</h3></div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-4">
                <div class="card stat-card h-100 border-start border-4 border-danger">
                    <div class="card-body d-flex align-items-center p-3">
                        <div class="icon-box bg-danger bg-opacity-10 text-danger me-2" style="width: 40px; height: 40px; font-size: 1.2rem;"><i class="fas fa-user-times"></i></div>
                        <div><h6 class="text-danger small fw-bold mb-0" style="font-size: 0.7rem;">SV CẢNH BÁO</h6><h3 class="fw-bold mb-0 text-danger fs-4" id="warningCount">--</h3></div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-4">
                <div class="card stat-card h-100 border-start border-4 border-warning">
                    <div class="card-body d-flex align-items-center p-3">
                        <div class="icon-box bg-warning bg-opacity-10 text-warning-emphasis me-2" style="width: 40px; height: 40px; font-size: 1.2rem;"><i class="fas fa-book-dead"></i></div>
                        <div><h6 class="text-warning-emphasis small fw-bold mb-0" style="font-size: 0.7rem;">MÔN CẢNH BÁO</h6><h3 class="fw-bold mb-0 text-warning-emphasis fs-4" id="subWarningCount">--</h3></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mb-4 border-0 shadow-sm" id="detailSection">
            <div class="card-header bg-white fw-bold border-0 pt-3"><i class="fas fa-list-ul text-secondary me-2"></i> MÔN CÓ CẢNH BÁO</div>
            <div class="card-body pt-0">
                <div class="row g-2" id="warningSubjectList"></div>
            </div>
        </div>

        <div class="d-flex flex-column flex-md-row gap-2 mb-3 justify-content-between">
            <div class="d-flex gap-2 flex-wrap align-items-center">
                <select class="form-select form-select-sm w-auto fw-bold border-secondary text-primary" id="yearFilter" onchange="render()"><option value="all">Năm: Tất cả</option></select>
                <select class="form-select form-select-sm w-auto fw-bold bg-primary text-white" id="semFilter" onchange="render(); updateDiemDanhLink();"><option value="HK1">HK1</option><option value="HK2">HK2</option><option value="HK3">HK3</option></select>
                <div class="bg-white px-2 py-1 rounded border fw-bold text-secondary shadow-sm" style="font-size: 0.9rem;">Sinh viên vắng: <span class="text-danger" id="filterTotalCount">0</span></div>
                <input type="text" class="form-control form-control-sm w-auto" id="search" onkeyup="renderTable()" placeholder="Tìm kiếm...">
                <select class="form-select form-select-sm w-auto" id="subFilter" onchange="renderTable()"><option value="all">Tất cả môn</option></select>
                <select class="form-select form-select-sm w-auto" id="statusFilter" onchange="renderTable()"><option value="all">Tất cả</option><option value="warning" class="text-danger">🔴 Cảnh báo</option></select>
            </div>
            <div class="mt-2 mt-md-0 d-flex gap-2 align-items-center">
                <button class="btn btn-success btn-sm" onclick="exportExcel()"><i class="fas fa-file-excel"></i> Excel</button>
                <a href="diemdanh.html" class="btn btn-primary btn-sm" id="btnDiemDanh"><i class="fas fa-pen-nib"></i> Điểm danh</a>
            </div>
        </div>

        <div class="table-card p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" id="mainTable">
                    <thead class="bg-light">
                        <tr>
                            <th>STT</th>
                            <th>Họ và tên</th>
                            <th>Môn học</th>
                            <th>Ngày</th>
                            <th>Buổi</th>
                            <th>Lý do</th>
                            <th>Minh chứng</th>
                            <th>Vắng</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="8" class="text-center py-4 text-muted">Đang tải dữ liệu...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="proofModal">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-body text-center p-0">
                    <img id="proofImg" class="img-fluid w-100" style="display:none;">
                    <div id="noProof" class="py-5 text-muted" style="display:none"><i class="fas fa-file-slash fs-1 mb-3"></i><h5>Không có ảnh</h5></div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let db = {}; 
        let globalTotalStudents = 0;
        let allSubjectsInfo = [];
        
        function formatDateVN(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            if (isNaN(date.getTime())) return '-';
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            return `${day}/${month}/${year}`;
        }

        async function init() {
            displayUserInfo();
            checkAdminDisplay();
            try {
                const semSelect = document.getElementById('semFilter');
                const savedSem = localStorage.getItem('currentSemester');
                if (savedSem) semSelect.value = savedSem;
                const res = await fetch('/api/data/dashboard');
                if(!res.ok) throw new Error('Lỗi Server');
                db = await res.json();
                globalTotalStudents = db.globalTotal || 0; 
                const resSub = await fetch('/api/data/subjects');
                if(resSub.ok) allSubjectsInfo = await resSub.json();
                populateYearFilter(); 
                render();
            } catch (error) { console.error(error); db = {}; render(); }
        }

        function displayUserInfo() {
            const userStr = localStorage.getItem('user');
            if (userStr) {
                const user = JSON.parse(userStr);
                document.getElementById('userNameDisplay').innerText = user.full_name || user.username;
            }
        }

        function checkAdminDisplay() {
            const userStr = localStorage.getItem('user');
            if (userStr) {
                const user = JSON.parse(userStr);
                if (user.role === 'admin') {
                    const placeholder = document.getElementById('adminButtonPlaceholder');
                    placeholder.innerHTML = `<a href="quanly.html" class="btn btn-warning btn-sm fw-bold"><i class="fas fa-user-cog"></i></a>`;
                }
            }
        }

        function populateYearFilter() {
            const years = new Set(["2023-2024", "2024-2025", "2025-2026", "2026-2027"]); 
            if (allSubjectsInfo && allSubjectsInfo.length > 0) allSubjectsInfo.forEach(s => { if (s.school_year) years.add(s.school_year); });
            const sortedYears = Array.from(years).sort().reverse();
            const yearSelect = document.getElementById('yearFilter');
            yearSelect.innerHTML = '<option value="all">Năm: Tất cả</option>';
            sortedYears.forEach(y => yearSelect.add(new Option(y, y)));
            const today = new Date();
            const year = today.getFullYear();
            const month = today.getMonth() + 1;
            const currentYear = month >= 8 ? `${year}-${year+1}` : `${year-1}-${year}`;
            if (years.has(currentYear)) yearSelect.value = currentYear; else yearSelect.value = "all";
        }

        function render() {
            const sem = document.getElementById('semFilter').value;
            localStorage.setItem('currentSemester', sem);
            updateDiemDanhLink();
            const currentData = db[sem] || { total: globalTotalStudents, subjects: [], data: [] };
            const selYear = document.getElementById('yearFilter').value;
            document.getElementById('semesterDisplay').innerText = `Dữ liệu: ${sem}`;
            document.getElementById('yearHeaderDisplay').innerText = selYear === 'all' ? 'Năm: Tất cả' : `Năm: ${selYear}`;
            document.getElementById('totalCount').innerText = globalTotalStudents;
            const subSelect = document.getElementById('subFilter');
            const currentSubVal = subSelect.value;
            subSelect.innerHTML = '<option value="all">Tất cả môn</option>';
            if (currentData.subjects) currentData.subjects.forEach(s => subSelect.add(new Option(s, s)));
            if (currentSubVal && currentSubVal !== 'all' && currentData.subjects.includes(currentSubVal)) subSelect.value = currentSubVal;
            renderTable(currentData);
            renderWarningCards(currentData.data);
        }
        
        function updateDiemDanhLink() {
            const sem = document.getElementById('semFilter').value;
            const btnDiemDanh = document.getElementById('btnDiemDanh');
            if (btnDiemDanh) btnDiemDanh.href = `diemdanh.html?semester=${sem}`;
        }

        function renderTable(currentData) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            let visibleCount = 0;
            if (!currentData.data || currentData.data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center py-4 text-muted fst-italic">Chưa có dữ liệu vắng.</td></tr>';
                document.getElementById('warningCount').innerText = 0;
                document.getElementById('subWarningCount').innerText = 0;
                document.getElementById('filterTotalCount').innerText = 0; 
                return;
            }
            const search = document.getElementById('search').value.toLowerCase();
            const subFilter = document.getElementById('subFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;
            const yearFilter = document.getElementById('yearFilter').value;
            
            let stt = 1, warnCount = 0, subWarnSet = new Set();

            currentData.data.forEach(sv => {
                if (search && !sv.name.toLowerCase().includes(search) && !sv.mssv.includes(search)) return;
                const visibleDetails = sv.details.filter(d => {
                    const matchSub = subFilter === 'all' || d.sub === subFilter;
                    const recordYear = d.school_year || '2024-2025';
                    const matchYear = yearFilter === 'all' || recordYear === yearFilter;
                    return matchSub && matchYear;
                });
                
                let total = visibleDetails.length;
                let isWarning = total >= 2;
                if (statusFilter === 'warning' && !isWarning) return;
                if (total > 0) visibleCount++; else return;
                if (isWarning) { warnCount++; visibleDetails.forEach(d => subWarnSet.add(d.sub)); }
                
                const rowClass = isWarning ? 'alert-row' : '';
                const totalColor = isWarning ? 'text-danger' : 'text-success';
                
                if (visibleDetails.length > 0) {
                    visibleDetails.forEach((d, idx) => {
                        const isFirstRow = idx === 0;
                        const rowspan = visibleDetails.length;
                        const dateStr = formatDateVN(d.date);
                        const reasonText = d.reason ? d.reason : '<i class="text-muted small">--</i>';
                        // [ĐÃ SỬA] Dùng class cụ thể (c-name, c-sub, c-date...) thay vì mặc định
                        const html = `
                            <tr class="${rowClass}">
                                ${isFirstRow ? `<td class="c-stt small" rowspan="${rowspan}">${stt++}</td>` : ''}
                                ${isFirstRow ? `<td class="c-name" rowspan="${rowspan}"><div class="fw-bold ${isWarning ? 'text-danger' : ''}">${sv.name}</div><div class="small text-muted" style="font-size:0.75rem">${sv.mssv}</div></td>` : ''}
                                <td class="c-sub subject-col"><span class="badge-sub" title="${d.sub}">${d.sub}</span><i class="fas fa-trash-alt delete-absence-icon" title="Hủy vắng" onclick="removeAbsence(${d.record_id}, '${sv.name}', '${d.sub}')"></i></td>
                                <td class="c-date small">${dateStr}</td>
                                <td class="c-session small">${d.session_time || '-'}</td>
                                <td class="c-reason small editable-reason" onclick="editReason(this, ${d.record_id})"><span class="reason-text">${reasonText}</span><i class="fas fa-pen edit-icon"></i></td>
                                <td class="c-proof"><button class="btn-action btn-sm" onclick="viewProof('${d.proof || ''}')"><i class="fas fa-eye"></i></button></td>
                                ${isFirstRow ? `<td class="c-absent" rowspan="${rowspan}"><span class="fw-bold ${totalColor}">${total}</span></td>` : ''}
                            </tr>`;
                        tbody.insertAdjacentHTML('beforeend', html);
                    });
                }
            });
            document.getElementById('warningCount').innerText = warnCount;
            document.getElementById('subWarningCount').innerText = subWarnSet.size;
            document.getElementById('filterTotalCount').innerText = visibleCount;
        }

        function editReason(td, recordId) {
            if (td.querySelector('input')) return;
            const span = td.querySelector('.reason-text');
            const currentText = span.innerText === '--' ? '' : span.innerText;
            td.innerHTML = '';
            const input = document.createElement('input'); input.type = 'text'; input.className = 'form-control form-control-sm d-inline-block w-75'; input.value = currentText;
            const btnSave = document.createElement('button'); btnSave.className = 'btn btn-success btn-sm ms-1'; btnSave.innerHTML = '<i class="fas fa-check"></i>';
            btnSave.onclick = (e) => { e.stopPropagation(); saveReasonDB(recordId, input.value, td); };
            td.appendChild(input); td.appendChild(btnSave); input.focus();
        }
        async function saveReasonDB(id, text, td) {
            try { const res = await fetch('/api/data/attendance/update-reason', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ record_id: id, reason: text }) }); if (res.ok) { td.innerHTML = `<span class="reason-text">${text || '<i class="text-muted small">--</i>'}</span> <i class="fas fa-pen edit-icon"></i>`; init(); } else alert("Lỗi lưu!"); } catch(e) { alert("Lỗi kết nối!"); }
        }
        async function removeAbsence(id, name, sub) {
            if (confirm(`HỦY VẮNG cho sinh viên:\n${name} - Môn: ${sub}?`)) { try { const res = await fetch('/api/data/attendance/remove-absence', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ record_id: id }) }); if (res.ok) { init(); } else alert("Lỗi server!"); } catch(e) { alert("Lỗi kết nối!"); } }
        }
        function renderWarningCards(data) {
            const container = document.getElementById('warningSubjectList'); container.innerHTML = ''; if (!data || data.length === 0) return;
            const subCounts = {}; const selYear = document.getElementById('yearFilter').value;
            data.forEach(sv => { const grouped = {}; const filteredDetails = sv.details.filter(d => { const recordYear = d.school_year || '2024-2025'; return selYear === 'all' || recordYear === selYear; }); filteredDetails.forEach(d => grouped[d.sub] = (grouped[d.sub] || 0) + 1); for (let sub in grouped) if (grouped[sub] >= 2) subCounts[sub] = (subCounts[sub] || 0) + 1; });
            if(Object.keys(subCounts).length === 0) { container.innerHTML = '<div class="col-12 text-center text-muted fst-italic py-3">Không có cảnh báo trong năm này.</div>'; return; }
            for(let [k,v] of Object.entries(subCounts)) {
                const t = allSubjectsInfo.find(s=>s.subject_name===k)?.teacher_name || "Chưa cập nhật";
                container.insertAdjacentHTML('beforeend', `<div class="col-12 col-md-4"><div class="p-3 detail-card d-flex justify-content-between align-items-center" onclick="quickFilter('${k}')"><div><div class="fw-bold text-dark">${k}</div><div class="small text-muted">GV: ${t}</div></div><div class="text-end"><span class="badge bg-danger">${v} SV</span></div></div></div>`);
            }
        }
        function quickFilter(s) { document.getElementById('subFilter').value=s; document.getElementById('statusFilter').value='warning'; renderTable(db[document.getElementById('semFilter').value]); document.querySelector('.table-card').scrollIntoView({ behavior: 'smooth' }); }
        function viewProof(u) { const m = new bootstrap.Modal(document.getElementById('proofModal')); const i = document.getElementById('proofImg'); const n = document.getElementById('noProof'); if(u && (u.match(/\.(jpeg|jpg|gif|png)$/i) || u.startsWith('blob:'))) { i.src=u; i.style.display='block'; n.style.display='none'; } else { i.style.display='none'; n.style.display='block'; } m.show(); }
        function exportExcel() { const wb = XLSX.utils.table_to_book(document.getElementById('mainTable'), {sheet:"Data"}); XLSX.writeFile(wb, "Report.xlsx"); }
        function performLogout() { auth.logout(); }
        init();
    </script>
</body>
</html>
