<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .login-header { text-align: center; margin-bottom: 30px; }
        .login-header h2 { margin: 0; color: #333; font-weight: 700; }
        .login-header p { color: #666; margin-top: 5px; }
        .form-group { margin-bottom: 20px; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; transition: 0.3s; }
        .form-control:focus { border-color: #3498db; outline: none; box-shadow: 0 0 0 3px rgba(52,152,219,0.2); }
        .btn-login { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-login:hover { background: #2980b9; }
        .links { margin-top: 20px; text-align: center; font-size: 14px; }
        .links a { color: #3498db; text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header"><h2>ĐĂNG NHẬP</h2><p>Hệ thống quản lý sinh viên</p></div>
        <form id="loginForm">
            <div class="form-group"><input type="text" id="username" class="form-control" placeholder="Tên đăng nhập" required></div>
            <div class="form-group"><input type="password" id="password" class="form-control" placeholder="Mật khẩu" required></div>
            <button type="submit" class="btn-login">Đăng nhập</button>
        </form>
        <div class="links"><a href="forgot-password.html">Quên mật khẩu?</a></div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            try {
                const res = await fetch('/api/auth/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({username:u, password:p}) });
                const data = await res.json();
                if(res.ok) { localStorage.setItem('user', JSON.stringify(data.user)); window.location.href = 'index.html'; } else alert(data.message);
            } catch(e) { alert('Lỗi kết nối'); }
        });
    </script>
</body>
</html>
