<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Trị</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="auth.js"></script> 
    <style>
        body { background-color: #f4f7fa; font-family: 'Segoe UI', sans-serif; padding-bottom: 70px; }
        .sidebar { width: 250px; background: #2c3e50; min-height: 100vh; color: white; position: fixed; top: 0; left: 0; z-index: 100; transition: 0.3s; }
        .sidebar .nav-link { color: rgba(255,255,255,0.8); padding: 15px 20px; font-weight: 500; cursor: pointer; display: flex; align-items: center; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #34495e; color: white; border-left: 4px solid #3498db; }
        .main-content { margin-left: 250px; padding: 30px; transition: 0.3s; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .log-scroll-wrapper { max-height: 650px; overflow-y: auto; border: 1px solid #dee2e6; border-radius: 8px; }
        .log-table thead th { position: sticky; top: 0; z-index: 10; background-color: #e9ecef; border-bottom: 2px solid #dee2e6; }
        .pass-wrapper { position: relative; width: 120px; }
        .pass-wrapper input { width: 100%; border: none; background: transparent; pointer-events: none; font-family: monospace; }
        .pass-wrapper .eye-btn { position: absolute; right: 0; top: 50%; transform: translateY(-50%); cursor: pointer; color: #6c757d; font-size: 0.8rem; }
        @media (max-width: 768px) { .sidebar { left: -250px; } .sidebar.active { left: 0; } .main-content { margin-left: 0; } }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="p-3 text-center border-bottom border-secondary"><h4 class="fw-bold m-0"><i class="fas fa-shield-alt text-warning"></i> ADMIN</h4></div>
        <nav class="nav flex-column mt-3">
            <a class="nav-link active" onclick="showTab('users')"><i class="fas fa-users me-2"></i> Tài khoản</a>
            <a class="nav-link" onclick="showTab('logs')"><i class="fas fa-history me-2"></i> Nhật ký hoạt động</a>
            <a class="nav-link text-danger mt-3" href="index.html"><i class="fas fa-sign-out-alt me-2"></i> Thoát</a>
        </nav>
    </div>
    <div class="main-content">
        <button class="btn btn-dark d-md-none mb-3" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
        <div id="tab-users">
            <div class="d-flex justify-content-between align-items-center mb-4"><h3 class="fw-bold text-dark">Quản Lý Tài Khoản</h3><button class="btn btn-primary shadow-sm" onclick="openUserModal()"><i class="fas fa-plus"></i> Tạo mới</button></div>
            <div class="card p-0"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="bg-light"><tr><th>STT</th><th>Tên Đăng Nhập</th><th>Mật khẩu</th><th>Lớp</th><th>Vai Trò</th><th>Ngày Tạo</th><th class="text-end">Hành động</th></tr></thead><tbody id="userTableBody"></tbody></table></div></div>
        </div>
        <div id="tab-logs" style="display:none;">
            <div class="d-flex justify-content-between align-items-center mb-4"><h3 class="fw-bold text-dark">Nhật Ký Hoạt Động</h3><button class="btn btn-outline-secondary btn-sm" onclick="loadLogs()"><i class="fas fa-sync"></i> Làm mới</button></div>
            <div class="card p-0"><div class="log-scroll-wrapper"><table class="table table-striped align-middle mb-0 log-table"><thead class="bg-light"><tr><th style="width: 180px;">Thời gian</th><th style="width: 150px;">Người dùng</th><th style="width: 200px;">Hành động</th><th>Chi tiết</th></tr></thead><tbody id="logTableBody"></tbody></table></div></div>
        </div>
    </div>
    <div class="modal fade" id="userModal"><div class="modal-dialog"><div class="modal-content"><div class="modal-header border-0"><h5 class="modal-title fw-bold">Thông Tin Tài Khoản</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input type="hidden" id="userId"><div class="mb-3"><label>Tên đăng nhập</label><input type="text" class="form-control" id="username"></div><div class="mb-3"><label>Mật khẩu</label><input type="text" class="form-control" id="password" placeholder="Để trống nếu không đổi"></div><div class="mb-3"><label>Lớp (Tên hiển thị)</label><input type="text" class="form-control" id="fullname" placeholder="VD: 25TH01"></div><div class="mb-3"><label>Vai trò</label><select class="form-select" id="role"><option value="admin">Admin</option><option value="lecturer">Giảng viên</option><option value="bcs">BCS (Ban cán sự)</option><option value="bch">BCH (Ban chấp hành)</option></select></div></div><div class="modal-footer border-0"><button class="btn btn-primary w-100" onclick="saveUser()">Lưu</button></div></div></div></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let idle=0; setInterval(()=>{idle++;if(idle>=15)auth.logout()},60000); window.onmousemove=()=>idle=0;
        function showTab(t) { document.getElementById('tab-users').style.display = t==='users'?'block':'none'; document.getElementById('tab-logs').style.display = t==='logs'?'block':'none'; document.querySelectorAll('.nav-link').forEach(l=>l.classList.remove('active')); event.currentTarget.classList.add('active'); if(t==='users') loadUsers(); else loadLogs(); }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }
        async function loadUsers() {
            try { const res = await fetch('/api/data/admin/users'); const users = await res.json(); const tbody = document.getElementById('userTableBody'); tbody.innerHTML = '';
            users.forEach((u, i) => { const roleLabel = u.role === 'admin' ? '<span class="badge bg-danger">ADMIN</span>' : '<span class="badge bg-info text-dark">'+u.role.toUpperCase()+'</span>'; const passHtml = `<div class="pass-wrapper"><input type="password" value="${u.password||''}" id="pass-${u.id}" readonly><i class="fas fa-eye eye-btn" onclick="togglePass('pass-${u.id}')"></i></div>`; tbody.insertAdjacentHTML('beforeend', `<tr><td>${i+1}</td><td class="fw-bold text-primary">${u.username}</td><td>${passHtml}</td><td class="fw-bold">${u.full_name||'--'}</td><td>${roleLabel}</td><td class="small text-muted">${new Date(u.created_at).toLocaleDateString('vi-VN')}</td><td class="text-end"><button class="btn btn-sm btn-light text-warning" onclick="editUser(${u.id}, '${u.username}', '${u.full_name}', '${u.role}')"><i class="fas fa-pen"></i></button> <button class="btn btn-sm btn-light text-danger" onclick="deleteUser(${u.id})"><i class="fas fa-trash"></i></button></td></tr>`); }); } catch(e) { console.error(e); }
        }
        async function loadLogs() { const tbody = document.getElementById('logTableBody'); tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Đang tải...</td></tr>'; try { const res = await fetch('/api/data/admin/logs'); const logs = await res.json(); tbody.innerHTML = ''; if(logs.length === 0) { tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Chưa có hoạt động nào.</td></tr>'; return; } logs.forEach(l => { let actionClass = 'text-dark'; if(l.action.includes('Xóa')) actionClass = 'text-danger fw-bold'; if(l.action.includes('Tạo') || l.action.includes('Thêm')) actionClass = 'text-success fw-bold'; if(l.action.includes('Điểm danh')) actionClass = 'text-primary fw-bold'; tbody.insertAdjacentHTML('beforeend', `<tr><td class="text-muted small fw-bold">${new Date(l.created_at).toLocaleString('vi-VN')}</td><td class="fw-bold text-primary">${l.username}</td><td class="${actionClass}">${l.action}</td><td class="small text-muted text-wrap" style="max-width: 300px;">${l.details||''}</td></tr>`); }); } catch(e) { tbody.innerHTML = '<tr><td colspan="4" class="text-center text-danger">Lỗi tải dữ liệu.</td></tr>'; } }
        function togglePass(id) { const inp = document.getElementById(id); inp.type = inp.type === 'password' ? 'text' : 'password'; }
        function openUserModal() { document.getElementById('userId').value=''; document.getElementById('username').value=''; document.getElementById('password').value=''; document.getElementById('fullname').value=''; document.getElementById('userModal').querySelector('.modal-title').innerText='Tạo Tài Khoản'; new bootstrap.Modal(document.getElementById('userModal')).show(); }
        function editUser(id, u, f, r) { document.getElementById('userId').value=id; document.getElementById('username').value=u; document.getElementById('password').value=''; document.getElementById('fullname').value=f; document.getElementById('role').value=r; document.getElementById('userModal').querySelector('.modal-title').innerText='Sửa Tài Khoản'; new bootstrap.Modal(document.getElementById('userModal')).show(); }
        async function saveUser() { const id = document.getElementById('userId').value; const body = { username: document.getElementById('username').value, password: document.getElementById('password').value, full_name: document.getElementById('fullname').value, role: document.getElementById('role').value }; try { const res = await fetch(id ? `/api/data/admin/users/${id}` : '/api/data/admin/users', { method: id?'PUT':'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) }); if(res.ok) { bootstrap.Modal.getInstance(document.getElementById('userModal')).hide(); loadUsers(); alert('Thành công!'); } else alert('Lỗi!'); } catch(e) { alert('Lỗi server'); } }
        async function deleteUser(id) { if(confirm('Xóa tài khoản này?')) { await fetch(`/api/data/admin/users/${id}`, { method: 'DELETE' }); loadUsers(); } }
        loadUsers();
    </script>
</body>
</html>
