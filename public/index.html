<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sinh Viên</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <script src="auth.js"></script> 
    
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        .stat-card { border: none; border-radius: 15px; background: white; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.2s; }
        .stat-card:hover { transform: translateY(-3px); }
        .icon-box { width: 55px; height: 55px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; }
        
        /* CSS BẢNG */
        .table-card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .table { margin-bottom: 0; }
        .table thead th {
            vertical-align: middle; font-weight: 700; color: #495057; text-transform: uppercase;
            font-size: 0.85rem; background-color: #f8f9fa; border-bottom: 2px solid #dee2e6; white-space: nowrap;
        }
        .table tbody td { vertical-align: middle; padding-top: 12px; padding-bottom: 12px; }

        .badge-sub { 
            background: #f8f9fa; border: 1px solid #dee2e6; color: #495057; border-radius: 6px; 
            padding: 4px 8px; font-weight: 600; display: inline-block; max-width: 100%;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        
        .btn-action { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid #dee2e6; background: white; color: #6c757d; transition: 0.2s; cursor: pointer; margin: 0 auto; }
        .btn-action:hover { transform: scale(1.1); color: #0d6efd; border-color: #0d6efd; }
        
        .alert-row { background-color: #fff5f5 !important; }
        .alert-row td:first-child { border-left: 5px solid #dc3545; }
        
        .detail-card { background: #fff3cd; border: 1px solid #ffeeba; border-radius: 12px; cursor: pointer; transition: 0.2s; }
        .detail-card:hover { background: #ffe69c; transform: translateY(-2px); }

        /* CSS Mới cho tính năng Hover Edit */
        .hover-edit-container { position: relative; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .hover-edit-container .edit-icon { 
            opacity: 0; visibility: hidden; transition: all 0.2s ease; cursor: pointer; color: #0d6efd; font-size: 0.9rem;
        }
        .hover-edit-container:hover .edit-icon { opacity: 1; visibility: visible; }
        
        /* Riêng cho cột Môn học (căn trái) */
        .hover-edit-container.start { justify-content: flex-start; }
        
        .inline-input { border: 1px solid #0d6efd; border-radius: 4px; padding: 2px 5px; font-size: 0.9rem; width: 100%; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <span class="navbar-brand fw-bold"><i class="fas fa-user-shield"></i> DASHBOARD QUẢN LÝ SINH VIÊN</span>
            <div class="d-flex align-items-center gap-3">
                <div class="text-white small text-end d-none d-md-block">
                    <div id="semesterDisplay">Đang tải dữ liệu...</div>
                    <div id="classDisplayInfo">Lớp: Đang tải...</div>
                </div>
                <button class="btn btn-outline-light btn-sm fw-bold" onclick="performLogout()">
                    <i class="fas fa-sign-out-alt"></i> Thoát
                </button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row mb-4 g-3">
            <div class="col-md-4">
                <div class="card stat-card h-100">
                    <div class="card-body d-flex align-items-center justify-content-between">
                        <div class="d-flex align-items-center">
                            <div class="icon-box bg-primary bg-opacity-10 text-primary me-3"><i class="fas fa-users"></i></div>
                            <div>
                                <h6 class="text-muted small fw-bold mb-1">TỔNG SINH VIÊN</h6>
                                <select id="classFilter" class="form-select form-select-sm fw-bold border-0 bg-light" style="width: auto; cursor: pointer;" onchange="render()">
                                    <option value="all">25TH01 - 25TH02 (Tất cả)</option>
                                </select>
                            </div>
                        </div>
                        <h3 class="fw-bold mb-0 text-primary" id="totalCount">--</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card h-100 border-start border-4 border-danger">
                    <div class="card-body d-flex align-items-center">
                        <div class="icon-box bg-danger bg-opacity-10 text-danger me-3"><i class="fas fa-user-times"></i></div>
                        <div><h6 class="text-danger small fw-bold">SV BỊ CẢNH BÁO</h6><h3 class="fw-bold mb-0 text-danger" id="warningCount">--</h3></div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card h-100 border-start border-4 border-warning">
                    <div class="card-body d-flex align-items-center">
                        <div class="icon-box bg-warning bg-opacity-10 text-warning-emphasis me-3"><i class="fas fa-book-dead"></i></div>
                        <div><h6 class="text-warning-emphasis small fw-bold">MÔN CẢNH BÁO</h6><h3 class="fw-bold mb-0 text-warning-emphasis" id="subWarningCount">--</h3></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mb-4 border-0 shadow-sm" id="detailSection">
            <div class="card-header bg-white fw-bold border-0 pt-3"><i class="fas fa-list-ul text-secondary me-2"></i> MÔN HỌC CÓ SINH VIÊN BỊ CẢNH BÁO</div>
            <div class="card-body pt-0">
                <div class="row g-3" id="warningSubjectList"></div>
            </div>
        </div>

        <div class="d-flex flex-wrap gap-2 mb-3 justify-content-between">
            <div class="d-flex gap-2 flex-wrap">
                <select class="form-select w-auto fw-bold bg-primary text-white" id="semFilter" onchange="handleSemChange()"></select>
                <input type="text" class="form-control w-auto" id="search" onkeyup="renderTable()" placeholder="Tìm tên hoặc MSSV...">
                <select class="form-select w-auto text-primary fw-bold" id="subFilter" onchange="renderTable()">
                    <option value="all">Tất cả môn</option>
                </select>
                <select class="form-select w-auto" id="statusFilter" onchange="renderTable()">
                    <option value="all">Tất cả trạng thái</option>
                    <option value="warning" class="text-danger">🔴 Chỉ hiện Cảnh báo</option>
                </select>
            </div>
            <div>
                <button class="btn btn-success me-2" onclick="exportExcel()"><i class="fas fa-file-excel"></i> Xuất Excel</button>
                <a href="diemdanh.html" class="btn btn-primary" id="btnDiemDanh"><i class="fas fa-pen-nib"></i> Điểm danh</a>
            </div>
        </div>

        <div class="table-card">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" id="mainTable">
                    <thead>
                        <tr>
                            <th class="text-center" style="width: 5%;">STT</th>
                            <th class="text-start ps-3" style="width: 22%;">Sinh viên</th>
                            <th class="text-start" style="width: 23%;">Môn học</th>
                            <th class="text-center" style="width: 10%;">Ngày</th>
                            <th class="text-center" style="width: 8%;">Buổi</th>
                            <th class="text-center" style="width: 15%;">Lý do</th> <th class="text-center" style="width: 7%;">Minh chứng</th>
                            <th class="text-center" style="width: 10%;">Tổng Vắng</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="8" class="text-center py-4 text-muted">Đang tải dữ liệu...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="proofModal">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-body text-center p-4">
                    <img id="proofImg" class="img-fluid rounded shadow" style="display:none; max-height: 80vh;">
                    <div id="noProof" class="py-5 text-muted" style="display:none"><i class="fas fa-file-slash fs-1 mb-3"></i><h5>Không có minh chứng</h5></div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let db = {}; 
        let allSubjectsInfo = []; 

        async function init() {
            try {
                // Tạo danh sách kỳ
                const semSelect = document.getElementById('semFilter');
                semSelect.innerHTML = '';
                ["HK1", "HK2", "HK3"].forEach(sem => semSelect.add(new Option(sem, sem)));
                
                const savedSem = localStorage.getItem('currentSemester');
                if (savedSem) semSelect.value = savedSem;
                else semSelect.value = 'HK1';

                const res = await fetch('/api/data/dashboard');
                if(!res.ok) throw new Error('Lỗi Server');
                db = await res.json();

                const resSub = await fetch('/api/data/subjects');
                if(resSub.ok) allSubjectsInfo = await resSub.json();

                handleSemChange(); // Gọi hàm này để load cả lớp và dữ liệu
            } catch (error) { 
                console.error(error); 
                db = {};
                handleSemChange(); 
            }
        }

        // Xử lý khi đổi học kỳ: Cập nhật danh sách Lớp và Dữ liệu
        function handleSemChange() {
            const sem = document.getElementById('semFilter').value;
            localStorage.setItem('currentSemester', sem);
            updateDiemDanhLink();

            // Cập nhật Select Class dựa trên dữ liệu thực tế
            updateClassFilterOptions(sem);

            render();
        }

        function updateClassFilterOptions(sem) {
            const classSelect = document.getElementById('classFilter');
            const currentData = db[sem]?.data || [];
            
            // Lấy danh sách lớp duy nhất từ dữ liệu sinh viên
            const uniqueClasses = new Set();
            currentData.forEach(sv => {
                if(sv.class_name) uniqueClasses.add(sv.class_name);
            });
            const sortedClasses = Array.from(uniqueClasses).sort();

            // Giữ lại giá trị đang chọn nếu có, nếu không reset về 'all'
            const savedClass = classSelect.value;
            
            classSelect.innerHTML = '';
            // Option mặc định gộp
            const allOption = new Option("25TH01 - 25TH02 (Tổng)", "all");
            classSelect.add(allOption);

            sortedClasses.forEach(c => {
                classSelect.add(new Option(c, c));
            });

            if (savedClass && (savedClass === 'all' || sortedClasses.includes(savedClass))) {
                classSelect.value = savedClass;
            } else {
                classSelect.value = 'all';
            }
        }

        function render() {
            const sem = document.getElementById('semFilter').value;
            const classFilter = document.getElementById('classFilter').value;
            
            // Lấy dữ liệu gốc
            const rawDataObj = db[sem] || { total: 0, subjects: [], data: [] };
            
            // Lọc dữ liệu theo lớp
            let filteredData = [];
            if (classFilter === 'all') {
                filteredData = rawDataObj.data;
            } else {
                filteredData = rawDataObj.data.filter(sv => sv.class_name === classFilter);
            }

            // Cập nhật Header
            document.getElementById('semesterDisplay').innerText = `Dữ liệu: ${sem}`;
            document.getElementById('classDisplayInfo').innerText = `Lớp: ${classFilter === 'all' ? '25TH01 - 25TH02' : classFilter}`;
            
            // Cập nhật Tổng sinh viên theo lớp đã chọn
            document.getElementById('totalCount').innerText = filteredData.length;

            // Cập nhật bộ lọc môn học
            const subSelect = document.getElementById('subFilter');
            const currentSubVal = subSelect.value;
            subSelect.innerHTML = '<option value="all">Tất cả môn</option>';
            if (rawDataObj.subjects) rawDataObj.subjects.forEach(s => subSelect.add(new Option(s, s)));
            
            if (currentSubVal && currentSubVal !== 'all' && rawDataObj.subjects.includes(currentSubVal)) {
                 subSelect.value = currentSubVal;
            }

            renderTable(filteredData);
            renderWarningCards(filteredData);
        }
        
        function updateDiemDanhLink() {
            const sem = document.getElementById('semFilter').value;
            const btnDiemDanh = document.getElementById('btnDiemDanh');
            if (btnDiemDanh) {
                btnDiemDanh.href = `diemdanh.html?semester=${sem}`;
            }
        }

        function renderTable(dataList) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (!dataList || dataList.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center py-4 text-muted fst-italic">Chưa có dữ liệu vắng học cho lớp này.</td></tr>';
                document.getElementById('warningCount').innerText = 0;
                document.getElementById('subWarningCount').innerText = 0;
                return;
            }

            const search = document.getElementById('search').value.toLowerCase();
            const subFilter = document.getElementById('subFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;
            
            let stt = 1, warnCount = 0, subWarnSet = new Set();

            dataList.forEach(sv => {
                if (search && !sv.name.toLowerCase().includes(search) && !sv.mssv.includes(search)) return;
                const visibleDetails = sv.details.filter(d => subFilter === 'all' || d.sub === subFilter);
                let total = visibleDetails.length;
                let isWarning = total >= 2;
                
                if (statusFilter === 'warning' && !isWarning) return;
                if (total === 0 && subFilter !== 'all') return;

                if (isWarning) { warnCount++; visibleDetails.forEach(d => subWarnSet.add(d.sub)); }

                const rowClass = isWarning ? 'alert-row' : '';
                const totalColor = isWarning ? 'text-danger' : 'text-success';
                
                if (visibleDetails.length > 0) {
                    visibleDetails.forEach((d, idx) => {
                        const isFirstRow = idx === 0;
                        const rowspan = visibleDetails.length;
                        
                        const dateStr = d.date ? new Date(d.date).toLocaleDateString('en-GB') : '-';
                        const reasonText = d.reason ? d.reason : '-';
                        
                        // ID duy nhất để xử lý edit
                        const rowId = `${sv.mssv}-${d.sub}-${d.date}`.replace(/\s/g, '');

                        const html = `
                            <tr class="${rowClass} row-hover">
                                ${isFirstRow ? `<td class="text-center fw-bold text-muted" rowspan="${rowspan}">${stt++}</td>` : ''}
                                
                                ${isFirstRow ? `<td class="text-start ps-3" rowspan="${rowspan}">
                                    <div class="fw-bold ${isWarning ? 'text-danger' : ''}">${sv.name}</div>
                                    <div class="small text-muted">${sv.mssv} - ${sv.class_name || ''}</div>
                                </td>` : ''}
                                
                                <td class="text-start">
                                    <div class="hover-edit-container start">
                                        <span class="badge-sub">${d.sub}</span>
                                        <i class="fas fa-pencil-alt edit-icon text-danger" title="Xóa môn (Bỏ vắng)" 
                                           onclick="deleteRecord('${sv.mssv}', '${d.sub}', '${d.date}', '${d.session_time}')"></i>
                                    </div>
                                </td>
                                <td class="text-center">${dateStr}</td>
                                <td class="text-center">${d.session_time || '-'}</td>
                                
                                <td class="text-center small text-muted" id="reason-cell-${rowId}">
                                    <div class="hover-edit-container">
                                        <span id="reason-text-${rowId}">${reasonText}</span>
                                        <i class="fas fa-pencil-alt edit-icon" title="Sửa lý do" 
                                           onclick="enableEditReason('${rowId}', '${sv.mssv}', '${d.sub}', '${d.date}', '${d.session_time}')"></i>
                                    </div>
                                </td>
                                
                                <td class="text-center"><button class="btn-action" onclick="viewProof('${d.proof || ''}')"><i class="fas fa-eye"></i></button></td>
                                
                                ${isFirstRow ? `<td class="text-center" rowspan="${rowspan}"><span class="fw-bold fs-5 ${totalColor}">${total}</span></td>` : ''}
                            </tr>`;
                        tbody.insertAdjacentHTML('beforeend', html);
                    });
                }
            });

            document.getElementById('warningCount').innerText = warnCount;
            document.getElementById('subWarningCount').innerText = subWarnSet.size;
        }

        // --- TÍNH NĂNG CHỈNH SỬA LÝ DO ---
        function enableEditReason(rowId, mssv, sub, date, session) {
            const cell = document.getElementById(`reason-cell-${rowId}`);
            const textSpan = document.getElementById(`reason-text-${rowId}`);
            const currentVal = textSpan.innerText === '-' ? '' : textSpan.innerText;

            // Chuyển thành ô input
            cell.innerHTML = `
                <input type="text" class="inline-input" id="input-${rowId}" value="${currentVal}" 
                    onblur="saveReason('${rowId}', '${mssv}', '${sub}', '${date}', '${session}', this.value)"
                    onkeydown="if(event.key === 'Enter') this.blur()">
            `;
            setTimeout(() => document.getElementById(`input-${rowId}`).focus(), 100);
        }

        async function saveReason(rowId, mssv, sub, date, session, newVal) {
            const sem = document.getElementById('semFilter').value;
            newVal = newVal.trim();

            // Cập nhật Client Side (DB tạm)
            const svIndex = db[sem].data.findIndex(s => s.mssv === mssv);
            if(svIndex !== -1) {
                const detail = db[sem].data[svIndex].details.find(d => d.sub === sub && d.date === date && d.session_time == session);
                if(detail) detail.reason = newVal;
            }

            // Gửi API cập nhật (Giả lập)
            try {
                // await fetch('/api/update-reason', { method: 'POST', body: JSON.stringify({ sem, mssv, sub, date, reason: newVal }) });
                console.log(`Đã lưu lý do mới cho ${mssv}: ${newVal}`);
            } catch(e) { console.error("Lỗi lưu:", e); }

            render(); // Render lại bảng để thoát chế độ edit
        }

        // --- TÍNH NĂNG XÓA BẢN GHI (XÓA MÔN KHỎI DANH SÁCH VẮNG) ---
        async function deleteRecord(mssv, sub, date, session) {
            if(!confirm(`Xác nhận xóa môn ${sub} ngày ${new Date(date).toLocaleDateString('vi-VN')} của SV ${mssv}?\n(Hành động này sẽ bỏ tính vắng cho buổi học này).`)) return;

            const sem = document.getElementById('semFilter').value;

            // Xóa ở Client Side
            const svIndex = db[sem].data.findIndex(s => s.mssv === mssv);
            if(svIndex !== -1) {
                const sv = db[sem].data[svIndex];
                sv.details = sv.details.filter(d => !(d.sub === sub && d.date === date && d.session_time == session));
                
                // Nếu sinh viên không còn môn vắng nào, có thể xóa khỏi danh sách hoặc giữ lại tùy logic
                // Ở đây ta giữ lại object SV nhưng details rỗng sẽ bị ẩn bởi logic render
            }

            // Gửi API xóa (Giả lập)
            try {
                // await fetch('/api/delete-attendance', { method: 'POST', body: JSON.stringify({ sem, mssv, sub, date }) });
                console.log(`Đã xóa bản ghi ${sub} của ${mssv}`);
            } catch(e) { console.error("Lỗi xóa:", e); }

            render();
        }

        function renderWarningCards(data) {
            const container = document.getElementById('warningSubjectList');
            container.innerHTML = '';
            
            if (!data || data.length === 0) return;
            
            const subCounts = {};
            data.forEach(sv => {
                const grouped = {};
                sv.details.forEach(d => grouped[d.sub] = (grouped[d.sub] || 0) + 1);
                for (let sub in grouped) if (grouped[sub] >= 2) subCounts[sub] = (subCounts[sub] || 0) + 1;
            });

            if(Object.keys(subCounts).length === 0) {
                container.innerHTML = '<div class="col-12 text-center text-muted fst-italic py-3">Hiện tại không có cảnh báo nào.</div>';
                return;
            }

            for (let [subName, count] of Object.entries(subCounts)) {
                const subInfo = allSubjectsInfo.find(s => s.subject_name === subName);
                const teacherName = subInfo && subInfo.teacher_name ? subInfo.teacher_name : "Chưa cập nhật";

                container.insertAdjacentHTML('beforeend', `
                    <div class="col-md-4 col-sm-6">
                        <div class="p-3 detail-card d-flex justify-content-between align-items-center" onclick="quickFilter('${subName}')">
                            <div>
                                <div class="fw-bold text-dark">${subName}</div>
                                <div class="small text-muted"><i class="fas fa-chalkboard-teacher"></i> GV: ${teacherName}</div>
                            </div>
                            <div class="text-end">
                                <span class="badge bg-danger">${count} SV</span>
                                <div class="small text-danger mt-1 fw-bold" style="font-size: 0.7rem;">Xem <i class="fas fa-arrow-right"></i></div>
                            </div>
                        </div>
                    </div>`);
            }
        }

        function quickFilter(sub) {
            document.getElementById('subFilter').value = sub;
            document.getElementById('statusFilter').value = 'warning';
            renderTable(db[document.getElementById('semFilter').value].data); // Lưu ý: Cần fix chỗ này nếu muốn quick filter theo lớp đang chọn
            document.querySelector('.table-card').scrollIntoView({ behavior: 'smooth' });
        }

        function viewProof(url) {
            const modal = new bootstrap.Modal(document.getElementById('proofModal'));
            const img = document.getElementById('proofImg');
            const none = document.getElementById('noProof');
            if (url && (url.match(/\.(jpeg|jpg|gif|png)$/i) || url.startsWith('blob:'))) {
                img.src = url; img.style.display = 'block'; none.style.display = 'none';
            } else {
                img.style.display = 'none'; none.style.display = 'block';
            }
            modal.show();
        }

        function exportExcel() {
            const table = document.getElementById("mainTable");
            const wb = XLSX.utils.table_to_book(table, {sheet: "Báo Cáo"});
            XLSX.writeFile(wb, "Danh_Sach_Canh_Bao.xlsx");
        }

        init();
    </script>
</body>
</html>
