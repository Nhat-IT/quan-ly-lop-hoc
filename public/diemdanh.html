<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Điểm Danh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <script src="auth.js"></script>
    <style>
        body { background-color: #f4f7fa; font-family: 'Segoe UI', sans-serif; padding-bottom: 100px; }
        .sticky-header { background: #fff; position: sticky; top: 0; z-index: 100; padding: 10px; border-bottom: 1px solid #ddd; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        #listContainer { background: #fff; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }
        .list-scroll { max-height: 60vh; overflow-y: auto; }
        .list-header { position: sticky; top: 0; background: #e9ecef; z-index: 10; display: flex; font-weight: bold; padding: 10px; border-bottom: 1px solid #ddd; }
        .col-stt { width: 50px; text-align: center; }
        .col-name { flex: 1; padding-left: 10px; }
        .col-mssv { width: 100px; text-align: center; }
        .col-class { width: 80px; text-align: center; }
        .col-check { width: 60px; text-align: center; }
        .student-row { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #eee; transition: 0.2s; }
        .student-row:hover { background: #f9f9f9; }
        .student-row.absent { background: #fff0f3; border-left: 3px solid #dc3545; }
        #btnScrollTop { position: fixed; bottom: 80px; right: 20px; width: 45px; height: 45px; background: #0d6efd; color: white; border-radius: 50%; display: none; align-items: center; justify-content: center; z-index: 99; cursor: pointer; border: none; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <button id="btnScrollTop" onclick="window.scrollTo({top:0, behavior:'smooth'})"><i class="fas fa-arrow-up"></i></button>

    <div class="sticky-header d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-3">
            <a href="index.html" class="btn btn-outline-secondary rounded-circle"><i class="fas fa-arrow-left"></i></a>
            <h5 class="m-0 fw-bold">ĐIỂM DANH</h5>
        </div>
        <div class="text-end">
            <div class="fw-bold small" id="currUser">--</div>
            <div class="badge bg-primary" id="currRole">--</div>
        </div>
    </div>

    <div class="container py-3">
        <div class="card p-3 mb-3 border-0 shadow-sm">
            <div class="row g-2">
                <div class="col-6 col-md-2">
                    <label class="small text-muted">Năm học</label>
                    <select class="form-select form-select-sm fw-bold" id="yearFilter" onchange="filterSubjects()"></select>
                </div>
                <div class="col-6 col-md-2">
                    <label class="small text-muted">Học kỳ</label>
                    <select class="form-select form-select-sm fw-bold text-success" id="semFilter" onchange="filterSubjects()">
                        <option value="HK1">HK1</option><option value="HK2">HK2</option><option value="HK3">HK3</option>
                    </select>
                </div>
                <div class="col-12 col-md-6">
                    <label class="small text-muted">Môn học</label>
                    <div class="input-group input-group-sm">
                        <select class="form-select fw-bold text-primary" id="subSelect" onchange="changeSubject()"></select>
                        <button class="btn btn-success" onclick="openAddSubject()" title="Thêm môn"><i class="fas fa-plus"></i></button>
                    </div>
                </div>
                <div class="col-6 col-md-2">
                    <label class="small text-muted">Buổi</label>
                    <select class="form-select form-select-sm fw-bold" id="session" onchange="loadAttendance()">
                        <option>Sáng</option><option>Chiều</option><option>Tối</option>
                    </select>
                </div>
            </div>
            <div class="row g-2 mt-1">
                <div class="col-md-3"><input type="date" class="form-control form-control-sm fw-bold" id="date" onchange="loadAttendance()"></div>
                <div class="col-md-9 d-flex gap-2 justify-content-end">
                    <button class="btn btn-warning btn-sm text-white" onclick="openEditSubject()"><i class="fas fa-pen"></i> Sửa Môn</button>
                    <button class="btn btn-success btn-sm" onclick="document.getElementById('fileInput').click()"><i class="fas fa-file-excel"></i> Nhập DS</button>
                    <input type="file" id="fileInput" hidden onchange="handleFile(event)">
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="text-muted small">Sĩ số: <b id="countTotal">0</b> | Hiện: <b id="countFilter">0</b></span>
            <button class="btn btn-primary btn-sm" onclick="openAddStudent()"><i class="fas fa-user-plus"></i> Thêm SV</button>
        </div>
        
        <input type="text" class="form-control mb-3" id="search" onkeyup="render()" placeholder="Tìm tên, MSSV...">

        <div id="listContainer">
            <div class="list-header">
                <div class="col-stt">STT</div><div class="col-name">HỌ VÀ TÊN</div><div class="col-mssv">MSSV</div><div class="col-class">LỚP</div><div class="col-check">VẮNG</div>
            </div>
            <div id="listBody" class="list-scroll"></div>
        </div>
    </div>

    <div class="fixed-bottom bg-white p-3 border-top shadow d-flex justify-content-between align-items-center">
        <div class="fw-bold text-danger">Vắng: <span id="countAbsent">0</span></div>
        <button class="btn btn-primary fw-bold rounded-pill px-4" onclick="saveData()">LƯU LẠI</button>
    </div>

    <div class="modal fade" id="modalAddSubject"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Thêm Môn Mới</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body">
        <input class="form-control mb-2" id="newSubName" placeholder="Tên môn">
        <input class="form-control mb-2" id="newTeacher" placeholder="Giảng viên">
        <div class="row"><div class="col-6"><input type="number" class="form-control" id="newY1" placeholder="2025"></div><div class="col-6"><input type="number" class="form-control" id="newY2" placeholder="2026"></div></div>
    </div><div class="modal-footer"><button class="btn btn-primary w-100" onclick="saveNewSubject()">Lưu</button></div></div></div></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let idle=0; setInterval(()=>{idle++;if(idle>=15)auth.logout()},60000); window.onmousemove=()=>idle=0;
        window.onscroll=()=>document.getElementById("btnScrollTop").style.display = window.scrollY > 300 ? "block" : "none";
        document.getElementById('date').valueAsDate = new Date();

        let subjects=[], students=[], currentUser=null;

        async function init() {
            const uStr = localStorage.getItem('user');
            if(!uStr) return window.location.href='login.html';
            currentUser = JSON.parse(uStr);
            document.getElementById('currUser').innerText = currentUser.fullName;
            document.getElementById('currRole').innerText = currentUser.role.toUpperCase();

            // [MỚI] Lấy semester đã chọn từ index.html
            const savedSem = localStorage.getItem('currentSemester');
            if(savedSem) document.getElementById('semFilter').value = savedSem;

            const res = await fetch('/api/data/subjects');
            subjects = await res.json();
            
            const ySel = document.getElementById('yearFilter');
            const years = [...new Set(subjects.map(s => s.school_year))].sort().reverse();
            years.forEach(y => ySel.add(new Option(y,y)));
            if(years.length) ySel.value = years[0];

            filterSubjects(true);
        }

        function filterSubjects() {
            const year = document.getElementById('yearFilter').value;
            const sem = document.getElementById('semFilter').value;
            const subSel = document.getElementById('subSelect'); subSel.innerHTML = '';
            
            const filtered = subjects.filter(s => s.school_year === year && s.semester === sem);
            filtered.forEach(s => subSel.add(new Option(s.subject_name, s.id)));
            
            if(filtered.length > 0) changeSubject();
            else { students=[]; render(); }
        }

        async function changeSubject() {
            const subId = document.getElementById('subSelect').value;
            if(!subId) return;
            const res = await fetch(`/api/data/students/${subId}`);
            let data = await res.json();

            // [MỚI] Lọc sinh viên theo lớp user
            if(currentUser.role !== 'admin') {
                data = data.filter(s => s.class_name === currentUser.fullName);
            }
            
            students = data;
            loadAttendance(); // Tải xong mới render
        }

        function render() {
            const list = document.getElementById('listBody'); list.innerHTML = '';
            const txt = document.getElementById('search').value.toLowerCase();
            const filtered = students.filter(s => s.full_name.toLowerCase().includes(txt) || s.mssv.includes(txt));
            
            document.getElementById('countTotal').innerText = students.length;
            document.getElementById('countFilter').innerText = filtered.length;

            if(filtered.length === 0) { list.innerHTML = '<div class="text-center p-3 text-muted">Không tìm thấy sinh viên</div>'; return; }

            filtered.forEach((s, i) => {
                const isAbs = s.is_absent ? 'absent' : '';
                const checked = s.is_absent ? 'checked' : '';
                list.insertAdjacentHTML('beforeend', `
                    <div class="student-row ${isAbs}" id="row-${s.id}">
                        <div class="col-stt fw-bold text-muted">${i+1}</div>
                        <div class="col-name fw-bold">${s.full_name}</div>
                        <div class="col-mssv small text-muted">${s.mssv}</div>
                        <div class="col-class small">${s.class_name}</div>
                        <div class="col-check"><input type="checkbox" class="form-check-input" ${checked} onchange="toggle(${s.id})"></div>
                    </div>
                `);
            });
            updateCount();
        }

        function toggle(id) {
            const row = document.getElementById(`row-${id}`);
            const cb = row.querySelector('input');
            if(cb.checked) row.classList.add('absent'); else row.classList.remove('absent');
            const st = students.find(s => s.id == id);
            if(st) st.is_absent = cb.checked;
            updateCount();
        }

        function updateCount() {
            const cnt = document.querySelectorAll('.student-row input:checked').length;
            document.getElementById('countAbsent').innerText = cnt;
        }

        async function loadAttendance() {
            // Logic: Ở phiên bản đơn giản này, ta reset checkbox
            // Nếu muốn lấy data cũ từ server, cần API getAttendance và map lại vào students
            students.forEach(s => s.is_absent = false);
            render();
        }

        async function saveData() {
            const subId = document.getElementById('subSelect').value;
            const date = document.getElementById('date').value;
            const sess = document.getElementById('session').value;
            const attData = students.map(s => ({ student_id: s.id, is_absent: s.is_absent ? 1 : 0, reason: '', proof_image_url: '' }));

            await fetch('/api/data/attendance', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({
                    subject_id: subId, session_date: date, session_time: sess, learning_group: 'Nhóm 1',
                    attendance_data: attData, current_user: currentUser.username
                })
            });
            alert('Đã lưu thành công!');
        }

        // [SỬA LỖI] Mở đúng ID modal
        function openAddSubject() { new bootstrap.Modal(document.getElementById('modalAddSubject')).show(); }
        async function saveNewSubject() {
            const body = {
                subject_name: document.getElementById('newSubName').value,
                teacher_name: document.getElementById('newTeacher').value,
                school_year: `${document.getElementById('newY1').value}-${document.getElementById('newY2').value}`,
                semester: document.getElementById('newSemester').value
            };
            await fetch('/api/data/subjects', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
            location.reload();
        }

        function handleFile(e) { /* Logic import giữ nguyên như cũ */ }

        init();
    </script>
</body>
</html>
