<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Điểm Danh Sinh Viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <script src="auth.js"></script>
    <style>
        :root { 
            --primary-color: #3459e6; 
            --danger-color: #e6344a; 
            --bg-body: #f4f7fa; 
            --bg-white: #ffffff; 
            --text-dark: #2c3e50; 
            --border-color: #e2e8f0; 
            --student-grid: 15% 25% 20% 20% 20%; 
        }
        body { background-color: var(--bg-body); font-family: 'Segoe UI', sans-serif; color: var(--text-dark); padding-bottom: 100px; }
        
        /* Header & Controls */
        .sticky-header { background: var(--bg-white); position: sticky; top: 0; z-index: 1000; padding: 12px 0; border-bottom: 1px solid var(--border-color); box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .header-title { font-size: 1.5rem; font-weight: 800; text-transform: uppercase; color: var(--text-dark); margin-right: 20px; white-space: nowrap; }
        .header-subject { position: absolute; left: 50%; transform: translateX(-50%); font-size: 1.5rem; font-weight: bold; text-transform: uppercase; color: var(--primary-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 50%; }
        .btn-back-custom { width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; transition: transform 0.2s; background-color: #fff; border: 2px solid #e2e8f0; }
        .btn-back-custom:active { transform: scale(0.95); background-color: #f1f5f9; }
        .scrollable-controls { background: var(--bg-white); padding: 20px 0; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; }
        .lbl-caption { font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 6px; display: block; }
        .info-box { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 15px; height: 100%; display: flex; flex-direction: column; justify-content: center; }
        .info-label { font-size: 0.7rem; text-transform: uppercase; color: #64748b; font-weight: 700; margin-bottom: 4px; }
        .info-value { font-weight: 600; font-size: 0.95rem; color: #2c3e50; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* List Container */
        #studentListContainer { background-color: #fff; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
        .list-scroll-wrapper { max-height: 60vh; overflow-y: auto; overflow-x: hidden; }
        .list-header { position: sticky; top: 0; z-index: 10; background-color: #e9ecef; color: #495057; padding: 15px 0; border-bottom: 2px solid var(--border-color); display: grid; grid-template-columns: var(--student-grid); align-items: center; }
        .list-header > div { font-weight: 800 !important; font-size: 0.85rem; text-transform: uppercase; color: #2c3e50; text-align: center; }
        .list-header .col-name { text-align: left; padding-left: 20px; }
        
        /* Student Row */
        .student-row { background: var(--bg-white); border-bottom: 1px solid var(--border-color); padding: 0; transition: background 0.2s; display: flex; align-items: center; }
        .student-row:hover { background-color: #f8f9fa; }
        .student-row.is-absent { background-color: #fff0f3; border-left: 4px solid var(--danger-color); }
        .row-main-content { display: grid; grid-template-columns: var(--student-grid); align-items: center; width: 100%; padding: 12px 0; }
        .col-stt, .col-mssv, .col-class, .col-action { text-align: center; }
        
        /* [SỬA] CSS CHO TÊN VÀ ICON SỬA */
        .col-name { padding-left: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; position: relative; cursor: default; }
        
        /* Icon sửa: mặc định hiện mờ hoặc ẩn trên PC, hiện rõ trên Mobile */
        .col-name .edit-icon { 
            cursor: pointer;
            color: #ff9800; /* Màu cam nổi bật */
            margin-left: 10px; 
            padding: 5px; 
            position: relative;
            z-index: 100; /* [QUAN TRỌNG] Nổi lên trên để nhận click */
            transition: all 0.2s;
        }
        
        /* PC: Hover vào tên mới hiện icon */
        @media (min-width: 769px) {
            .col-name .edit-icon { opacity: 0.3; }
            .col-name:hover .edit-icon { opacity: 1; transform: scale(1.1); }
        }

        .col-action input[type="checkbox"] { width: 22px; height: 22px; cursor: pointer; }
        .note-input-group { display: none !important; margin: 5px 15px 15px 60px; padding: 12px; background-color: #f8f9fa; border-radius: 6px; border: 1px solid #e2e8f0; }
        .student-row.is-absent .note-input-group { display: block !important; }
        .proof-preview img { width: 80px; height: auto; border-radius: 4px; margin-top: 5px; cursor: pointer; border: 1px solid #ddd; }
        .bottom-bar-wrapper { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #eee; padding: 15px; z-index: 1000; box-shadow: 0 -5px 15px rgba(0,0,0,0.05); }
        .btn-excel { background-color: #217346 !important; border-color: #217346 !important; color: white !important; }
        .empty-state { padding: 40px; text-align: center; background: white; border-top: 1px solid var(--border-color); }
        
        #btnScrollTop { position: fixed; bottom: 80px; right: 20px; z-index: 999; width: 45px; height: 45px; border-radius: 50%; background: var(--primary-color); color: white; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.2); display: none; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; transition: 0.3s; }
        #btnScrollTop:hover { transform: translateY(-3px); background-color: #2546d1; }
        
        .dropdown-check-item { cursor: pointer; padding: 8px 15px; display: flex; align-items: center; }
        .dropdown-check-item:hover { background-color: #f8f9fa; }
        .dropdown-check-item input { margin-right: 10px; width: 18px; height: 18px; cursor: pointer; }
        .dropdown-check-item label { cursor: pointer; flex-grow: 1; margin-bottom: 0; }

        @media (min-width: 992px) {
            .filter-row-custom { flex-wrap: nowrap !important; }
            .filter-year { width: 170px; flex-shrink: 0; }
            .filter-sem { width: 110px; flex-shrink: 0; }
            .filter-add-btn { width: auto; flex-shrink: 0; }
            .filter-sub { flex-grow: 1; min-width: 200px; }
            .filter-tools { width: auto; flex-shrink: 0; display: flex; gap: 8px; }
        }
        @media (max-width: 991px) {
            .filter-row-custom { flex-wrap: wrap; }
            .filter-year, .filter-sem { width: 48%; }
            .filter-sub { width: 100%; order: 3; margin-top: 5px; }
            .filter-add-btn { width: auto; }
            .filter-tools { width: 100%; margin-top: 5px; display: flex; gap: 5px; }
        }
        
        /* CSS MOBILE (Đã tối ưu) */
        @media (max-width: 768px) {
            .sticky-header .header-subject { display: none; }
            .list-header { display: none; }
            
            .student-row { 
                flex-wrap: wrap; 
                padding: 15px 10px;
                padding-right: 60px; /* Chừa chỗ cho checkbox */
            }
            
            .col-stt { display: none; }
            
            .col-name { 
                width: 100%; 
                font-size: 1.15rem; 
                margin-bottom: 5px; 
                padding-left: 0; 
                line-height: 1.3;
            }
            
            /* [QUAN TRỌNG] Icon sửa trên mobile: Luôn hiện, to, dễ bấm */
            .col-name .edit-icon { 
                visibility: visible !important; 
                opacity: 1 !important; 
                color: #ff9800;
                margin-left: 10px;
                font-size: 1.3rem; 
                padding: 10px; /* Tăng vùng bấm */
                display: inline-block;
            }
            
            .col-mssv, .col-class { 
                width: auto; 
                font-size: 0.9rem; 
                color: #666; 
                margin-right: 15px; 
                text-align: left; 
            }
            .col-mssv::before { content: "MSSV: "; font-weight: normal; color: #888; }
            .col-class::before { content: "Lớp: "; font-weight: normal; color: #888; }
            
            /* Checkbox */
            .col-check { 
                position: absolute; 
                right: 10px; 
                top: 15px; 
                width: 40px !important;
                height: 40px;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            
            .col-check input[type="checkbox"] { 
                width: 28px; 
                height: 28px; 
                accent-color: #dc3545; 
            }
        }
    </style>
</head>
<body>

    <button id="btnScrollTop" onclick="scrollToTop()" title="Lên đầu trang"><i class="fas fa-arrow-up"></i></button>

    <div class="sticky-header">
        <div class="container d-flex align-items-center flex-wrap position-relative">
            <a href="index.html" class="btn rounded-circle shadow-sm me-3 btn-back-custom" title="Quay lại"><i class="fas fa-arrow-left"></i></a>
            <div class="header-title">ĐIỂM DANH</div>
            <div class="header-subject" id="displaySubjectName">--</div>
            
            <div class="ms-auto d-flex align-items-center text-secondary">
                <div class="text-end me-2 d-none d-md-block">
                    <div class="fw-bold small" id="ddUserName">--</div>
                    <div class="badge bg-primary" id="ddUserRole" style="font-size: 0.6rem;">--</div>
                </div>
                <i class="fas fa-user-circle fs-3 text-primary"></i>
            </div>
        </div>
    </div>
    
    <div class="scrollable-controls">
        <div class="container">
            <div class="card bg-light p-3 mb-3 border-0 shadow-sm">
                <label class="lbl-caption">Bộ lọc môn học</label> 
                <div class="d-flex gap-2 align-items-center filter-row-custom">
                    <div class="filter-year">
                        <select class="form-select fw-bold border-0 text-dark shadow-sm" id="yearSelect" onchange="filterSubjects()"></select>
                    </div>
                    <div class="filter-sem">
                        <select class="form-select fw-bold text-success border-0 shadow-sm" id="semesterSelect" onchange="filterSubjects()">
                            <option value="HK1">HK1</option><option value="HK2">HK2</option><option value="HK3">HK3</option>
                        </select>
                    </div>
                    <div class="filter-add-btn">
                        <button class="btn btn-success shadow-sm" onclick="openAddSubjectModal()" title="Thêm môn mới"><i class="fas fa-plus"></i></button>
                    </div>
                    <div class="filter-sub">
                        <select class="form-select fw-bold text-primary border-0 w-100 shadow-sm" id="subjectSelect" onchange="changeSubject()"></select>
                    </div>
                    <div class="filter-tools">
                        <button class="btn btn-warning shadow-sm" onclick="openEditSubjectModal()" title="Sửa môn"><i class="fas fa-pen text-white"></i></button>
                        <button class="btn btn-excel shadow-sm" id="btnImportExcel" onclick="importClassList()" title="Nhập danh sách sinh viên">
                            <i class="fas fa-file-excel"></i> <span class="d-none d-md-inline">Nhập DS</span>
                        </button>
                        <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" style="display: none;" onchange="handleFileSelect(event)">
                    </div>
                </div>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-md-4 col-12"><div class="info-box"><div class="info-label"><i class="fas fa-chalkboard-teacher me-1"></i> Giảng viên</div><div class="info-value" id="displayTeacherName">--</div></div></div>
                <div class="col-md-4 col-12"><div class="info-box"><div class="info-label"><i class="fas fa-calendar-alt me-1"></i> Năm học</div><div class="info-value text-primary" id="displaySchoolYear">--</div></div></div>
                <div class="col-md-2 col-6"><div class="info-box"><div class="info-label"><i class="far fa-calendar-check me-1"></i> Bắt đầu</div><div class="info-value text-success" id="displayStartDate">--</div></div></div>
                <div class="col-md-2 col-6"><div class="info-box"><div class="info-label"><i class="far fa-calendar-times me-1"></i> Kết thúc</div><div class="info-value text-danger" id="displayEndDate">--</div></div></div>
            </div>

            <div class="row g-3">
                <div class="col-md-3 col-12">
                    <label class="lbl-caption">Ngày điểm danh</label>
                    <input type="date" class="form-control fw-bold" id="todayDate" onchange="loadSavedAttendance()">
                </div>
                <div class="col-md-3 col-6">
                    <label class="lbl-caption">Buổi</label>
                    <select class="form-select fw-bold text-primary" id="sessionTime" onchange="loadSavedAttendance()">
                        <option>Sáng</option><option>Chiều</option><option>Tối</option>
                    </select>
                </div>
                <div class="col-md-6 col-12">
                    <label class="lbl-caption">Nhóm Học</label>
                    <div class="input-group">
                        <select class="form-select fw-bold text-success" id="groupSelect" onchange="renderList(); loadSavedAttendance()"></select>
                        <button class="btn btn-outline-warning" onclick="renameCurrentGroup()"><i class="fas fa-pen"></i></button>
                        <button class="btn btn-outline-danger" onclick="deleteCurrentGroup()"><i class="fas fa-trash"></i></button>
                        <button class="btn btn-outline-secondary" onclick="addNewGroup()"><i class="fas fa-plus"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container mt-4 mb-5">
        <div class="d-flex justify-content-between mb-3 align-items-end">
            <span class="text-muted small">Sĩ số: <b id="studentCount">0</b> | Hiện: <b id="filteredCount">0</b></span>
            <div class="d-flex gap-2">
                <button class="btn btn-success btn-sm" onclick="openAddStudentModal()"><i class="fas fa-user-plus"></i> Thêm SV</button>
            </div>
        </div>
        
        <div class="row g-2 mb-3">
            <div class="col-md-8 col-12"><input type="text" class="form-control" id="searchInput" onkeyup="filterList()" placeholder="Tìm tên, MSSV..."></div>
            
            <div class="col-md-4 col-12">
                <div class="dropdown">
                    <button class="btn btn-outline-primary w-100 fw-bold dropdown-toggle d-flex justify-content-between align-items-center" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" id="classFilterBtn">
                        <span><i class="fas fa-filter me-1"></i> <span id="classFilterText">Tất cả lớp</span></span>
                    </button>
                    <ul class="dropdown-menu shadow w-100" id="classFilterMenu" style="max-height: 300px; overflow-y: auto;"></ul>
                </div>
            </div>
        </div>

        <div id="studentListContainer">
            <div class="list-header">
                <div class="col-stt">STT</div><div class="col-name">HỌ VÀ TÊN</div><div class="col-mssv">MSSV</div><div class="col-class">LỚP</div><div class="col-action">VẮNG</div>
            </div>
            <div id="listBody" class="list-scroll-wrapper"></div>
        </div>
    </div>

    <div class="bottom-bar-wrapper">
        <div class="container d-flex justify-content-between align-items-center">
            <div><span class="text-muted small fw-bold text-uppercase">Vắng:</span> <span class="fw-bold text-danger fs-4" id="countAbsent">0</span></div>
            <div class="d-flex gap-2">
                <button class="btn btn-success btn-sm px-3 fw-bold rounded-pill d-none d-md-block" onclick="showExportModal()"><i class="fas fa-file-excel"></i> Xuất Excel</button>
                <button class="btn btn-primary px-4 fw-bold rounded-pill shadow" id="btnSave" onclick="submitAttendance()">LƯU LẠI</button>
            </div>
        </div>
    </div>

    <div class="modal fade" id="exportOptionModal">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0"><h5 class="modal-title fw-bold text-success"><i class="fas fa-file-excel me-2"></i>Tùy Chọn Xuất Excel</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body p-4">
                    <div class="d-grid gap-3">
                        <button class="btn btn-outline-primary py-2 fw-bold text-start" onclick="processExport('all')"><i class="fas fa-list-ul me-2"></i> Xuất Tất Cả</button>
                        <button class="btn btn-outline-success py-2 fw-bold text-start" onclick="processExport('filtered')"><i class="fas fa-filter me-2"></i> Xuất Theo Bộ Lọc</button>
                        <button class="btn btn-outline-danger py-2 fw-bold text-start" onclick="processExport('absent')"><i class="fas fa-user-times me-2"></i> Chỉ Xuất SV Vắng</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addSubjectModal"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header border-0"><h5 class="modal-title fw-bold text-success">Thêm Môn Mới</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input type="text" class="form-control mb-3" id="newSubjectName" placeholder="Tên môn học (Bắt buộc)"><input type="text" class="form-control mb-3" id="newTeacherName" placeholder="Tên giảng viên"><div class="row mb-3"><div class="col-7"><label class="small text-muted fw-bold">Năm học</label><div class="input-group"><input type="number" class="form-control text-center fw-bold" id="newYearStart" placeholder="2025"><span class="input-group-text bg-white fw-bold">-</span><input type="number" class="form-control text-center fw-bold" id="newYearEnd" placeholder="2026"></div></div><div class="col-5"><label class="small text-muted fw-bold">Học kỳ</label><select class="form-select" id="newSemester"><option value="HK1">HK1</option><option value="HK2" selected>HK2</option><option value="HK3">HK3</option></select></div></div><div class="row mb-3"><div class="col-6"><label class="small text-muted">Buổi</label><select class="form-select" id="newDefaultSession"><option>Sáng</option><option>Chiều</option><option>Tối</option></select></div><div class="col-6"><label class="small text-muted">Nhóm</label><select class="form-select" id="newDefaultGroup"><option>Nhóm 1</option><option>Nhóm 2</option><option>Nhóm 3</option></select></div></div><div class="row"><div class="col-6"><label class="form-label small fw-bold text-success">Bắt đầu</label><input type="date" class="form-control" id="newStartDate"></div><div class="col-6"><label class="form-label small fw-bold text-danger">Kết thúc</label><input type="date" class="form-control" id="newEndDate"></div></div></div><div class="modal-footer border-0"><button class="btn btn-success w-100" onclick="saveNewSubject()">Lưu Môn Học</button></div></div></div></div>
    <div class="modal fade" id="editSubjectModal"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header border-0"><h5 class="modal-title fw-bold text-warning">Chỉnh Sửa Môn</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input type="text" class="form-control mb-3" id="editSubjectName"><input type="text" class="form-control mb-3" id="editTeacherName"><div class="row mb-3"><div class="col-7"><label class="small text-muted fw-bold">Năm học</label><div class="input-group"><input type="number" class="form-control text-center fw-bold" id="editYearStart"><span class="input-group-text bg-white fw-bold">-</span><input type="number" class="form-control text-center fw-bold" id="editYearEnd"></div></div><div class="col-5"><label class="small text-muted fw-bold">Học kỳ</label><select class="form-select" id="editSemester"><option value="HK1">HK1</option><option value="HK2">HK2</option><option value="HK3">HK3</option></select></div></div><div class="row mb-3"><div class="col-6"><label class="small text-muted">Buổi</label><select class="form-select" id="editDefaultSession"><option>Sáng</option><option>Chiều</option><option>Tối</option></select></div><div class="col-6"><label class="small text-muted">Nhóm</label><select class="form-select" id="editDefaultGroup"><option>Nhóm 1</option><option>Nhóm 2</option><option>Nhóm 3</option></select></div></div><div class="row"><div class="col-6"><label class="form-label small fw-bold text-success">Bắt đầu</label><input type="date" class="form-control" id="editStartDate"></div><div class="col-6"><label class="form-label small fw-bold text-danger">Kết thúc</label><input type="date" class="form-control" id="editEndDate"></div></div></div><div class="modal-footer border-0 d-flex justify-content-between"><button class="btn btn-outline-danger" onclick="deleteSubject()">Xóa Môn</button><button class="btn btn-primary" onclick="saveEditedSubject()">Cập nhật</button></div></div></div></div>
    <div class="modal fade" id="addStudentModal"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header border-0"><h5 class="modal-title fw-bold text-success">Thêm SV</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input type="text" class="form-control mb-3" id="newStudentName" placeholder="Họ tên"><div class="row"><div class="col-6"><input type="text" class="form-control" id="newStudentMSSV" placeholder="MSSV"></div><div class="col-6"><input type="text" class="form-control" id="newStudentClass" placeholder="Lớp"></div></div></div><div class="modal-footer border-0"><button class="btn btn-success w-100" onclick="saveNewStudent()">Thêm</button></div></div></div></div>
    
    <div class="modal fade" id="editStudentModal"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-body">
        <input type="hidden" id="editStudentId">
        <div class="mb-3"><label>Tên</label><input type="text" class="form-control fw-bold" id="editStudentName"></div>
        <div class="row mb-3"><div class="col-6"><label>MSSV</label><input type="text" class="form-control" id="editStudentMSSV"></div><div class="col-6"><label>Lớp</label><input type="text" class="form-control" id="editStudentClass"></div></div>
        <div class="mb-3"><label>Nhóm</label><select class="form-select" id="editStudentGroup"></select></div>
    </div><div class="modal-footer d-flex justify-content-between"><button class="btn btn-outline-danger" onclick="deleteStudent()">Xóa</button><button class="btn btn-primary" onclick="saveEditedStudent()">Lưu</button></div></div></div></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let idleTime = 0; setInterval(() => { idleTime++; if(idleTime >= 15) auth.logout(); }, 60000);
        window.onmousemove = () => idleTime = 0;
        window.onscroll = () => document.getElementById("btnScrollTop").style.display = window.scrollY > 300 ? "block" : "none";
        function scrollToTop() { window.scrollTo({top: 0, behavior: 'smooth'}); }

        document.getElementById('todayDate').valueAsDate = new Date();
        let allSubjects = [], currentStudents = [], proofImages = {}, selectedClasses = new Set(), currentUser = null;

        async function init() {
            const userStr = sessionStorage.getItem('user'); 
            if(userStr) {
                currentUser = JSON.parse(userStr);
                document.getElementById('ddUserName').innerText = currentUser.fullName || currentUser.username;
                document.getElementById('ddUserRole').innerText = currentUser.role.toUpperCase();
            } else { window.location.href = 'login.html'; return; }

            try {
                const res = await fetch('/api/data/subjects'); allSubjects = await res.json();
                populateYearFilter();
                const savedSem = sessionStorage.getItem('currentSemester'); 
                if(savedSem) document.getElementById('semFilter').value = savedSem;
                const count = filterSubjects(true); 
                if(count > 0) changeSubject(); 
            } catch (error) { console.error(error); }
        }

        // ... (Các hàm populateYearFilter, filterSubjects, changeSubject giữ nguyên) ...
        function populateYearFilter() {
            const yearSelect = document.getElementById('yearSelect'); yearSelect.innerHTML = '';
            const years = [...new Set(allSubjects.map(s => s.school_year || '2024-2025'))].sort().reverse();
            if (years.length === 0) { const curY = new Date().getFullYear(); years.push(`${curY}-${curY+1}`); }
            years.forEach(y => yearSelect.add(new Option(y, y)));
        }
        function filterSubjects(silent = false) {
            const year = document.getElementById('yearSelect').value; const sem = document.getElementById('semesterSelect').value; const subSelect = document.getElementById('subjectSelect'); subSelect.innerHTML = '';
            const filtered = allSubjects.filter(s => { const sYear = s.school_year || '2024-2025'; return sYear === year && (s.semester || 'HK1') === sem; });
            if (filtered.length === 0) { subSelect.innerHTML = '<option value="">-- Không có môn --</option>'; if(!silent) { resetInfo(); currentStudents = []; renderList(); } return 0; }
            filtered.forEach(s => subSelect.add(new Option(s.subject_name, s.id)));
            if(!silent) changeSubject(); return filtered.length;
        }
        async function changeSubject() {
            const id = document.getElementById('subjectSelect').value; if(!id) return;
            const sub = allSubjects.find(s => s.id == id);
            if(sub) {
                document.getElementById('displaySubjectName').innerText = sub.subject_name.toUpperCase();
                document.getElementById('displayTeacherName').innerText = sub.teacher_name || "--";
                // ... (cập nhật info môn)
                if (sub.default_group) { const grpSel = document.getElementById('groupSelect'); grpSel.dataset.default = sub.default_group; }
            }
            try { 
                const res = await fetch(`/api/data/students/${id}`); 
                let fetchedStudents = await res.json(); 
                if (currentUser && currentUser.role !== 'admin') {
                    fetchedStudents = fetchedStudents.filter(s => s.class_name === currentUser.fullName);
                }
                currentStudents = fetchedStudents;
                populateGroupDropdown(); 
            } catch (e) { currentStudents = []; }
            renderList(); await loadSavedAttendance();
        }

        function renderList() {
            const list = document.getElementById('listBody'); list.innerHTML = '';
            const grp = document.getElementById('groupSelect').value;
            let filteredStudents = currentStudents.filter(s => (s.learning_group || 'Nhóm 1') === grp);
            updateClassFilterMenu(filteredStudents);
            if (selectedClasses.size > 0) filteredStudents = filteredStudents.filter(s => selectedClasses.has(s.class_name));
            document.getElementById('studentCount').innerText = currentStudents.filter(s => (s.learning_group || 'Nhóm 1') === grp).length;
            document.getElementById('filteredCount').innerText = filteredStudents.length;
            if (filteredStudents.length === 0) { list.innerHTML = `<div class="empty-state">Không tìm thấy sinh viên.</div>`; return; }
            
            filteredStudents.forEach((s, i) => {
                const checked = s.is_absent ? 'checked' : '';
                const isAbs = s.is_absent ? 'is-absent' : '';
                // [SỬA LỖI] THÊM event VÀO openEditStudent
                list.insertAdjacentHTML('beforeend', `
                <div class="student-row ${isAbs}" id="row-${s.id}" data-id="${s.id}" data-class="${s.class_name}" data-name="${s.full_name.toLowerCase()}" data-mssv="${s.mssv}">
                    <div class="col-stt">${i+1}</div>
                    <div class="col-name">${s.full_name} <i class="fas fa-pen edit-icon" onclick="openEditStudent(event, ${s.id})"></i></div>
                    <div class="col-mssv">${s.mssv}</div>
                    <div class="col-class">${s.class_name}</div>
                    <div class="col-check"><input type="checkbox" class="form-check-input" ${checked} onchange="toggleAbs(${s.id})"></div>
                    <div class="note-input-group"><input type="text" class="form-control form-control-sm txt-reason" placeholder="Lý do..."><div class="mt-1"><input type="file" class="form-control form-control-sm" onchange="handleProofUpload(${s.id},this)"><div id="proof-preview-${s.id}" class="proof-preview"></div></div></div>
                </div>`);
            });
            updateCount(); filterListBySearch();
        }

        // [SỬA LỖI] HÀM MỞ MODAL SỬA
        function openEditStudent(e, id) { 
            if(e) { e.preventDefault(); e.stopPropagation(); }
            
            const s = currentStudents.find(x => x.id == id); 
            if(!s) return;

            document.getElementById('editStudentId').value = id; 
            document.getElementById('editStudentName').value = s.full_name; 
            document.getElementById('editStudentMSSV').value = s.mssv; 
            document.getElementById('editStudentClass').value = s.class_name; 
            
            const sel = document.getElementById('editStudentGroup'); 
            sel.innerHTML = ''; 
            const mainOpts = document.getElementById('groupSelect').options;
            for(let i=0; i<mainOpts.length; i++) sel.add(new Option(mainOpts[i].text, mainOpts[i].value));
            sel.value = s.learning_group || 'Nhóm 1'; 
            
            new bootstrap.Modal(document.getElementById('editStudentModal')).show(); 
        }

        // ... (Các hàm phụ trợ khác toggleAbs, updateCount, saveEditedStudent... giữ nguyên) ...
        function updateClassFilterMenu(students) { /* ... */ }
        function filterListBySearch() { /* ... */ }
        function filterList() { filterListBySearch(); }
        function toggleAbs(id) { document.getElementById(`row-${id}`).classList.toggle('is-absent'); updateCount(); }
        function updateCount() { document.getElementById('countAbsent').innerText = document.querySelectorAll('.student-row .col-check input:checked').length; }
        function importClassList() { document.getElementById('fileInput').click(); }
        function handleFileSelect(e) { /* ... */ }
        function populateGroupDropdown() { const select = document.getElementById('groupSelect'); const currentSelection = select.value; select.innerHTML = ''; const groups = [...new Set(currentStudents.map(s => s.learning_group || 'Nhóm 1'))].sort(); if (groups.length === 0) groups.push('Nhóm 1'); groups.forEach(g => select.add(new Option(g, g))); if(select.dataset.default && groups.includes(select.dataset.default)) select.value = select.dataset.default; else select.value = groups.includes(currentSelection) ? currentSelection : groups[0]; delete select.dataset.default; }
        function resetInfo() { document.getElementById('displaySubjectName').innerText = "--"; document.getElementById('displayTeacherName').innerText = "--"; document.getElementById('displayStartDate').innerText = "--"; document.getElementById('displayEndDate').innerText = "--"; document.getElementById('displaySchoolYear').innerText = "--"; }
        function showExportModal() { new bootstrap.Modal(document.getElementById('exportOptionModal')).show(); }
        function processExport(type) { /* ... */ }
        function exportExcel() { showExportModal(); }
        function formatDateVN(dateStr) { if(!dateStr) return ''; const d = new Date(dateStr); return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`; }
        async function sendImport(sts) { await fetch('/api/data/students/import', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({subject_id:document.getElementById('subjectSelect').value, students:sts, learning_group:document.getElementById('groupSelect').value, current_user: currentUser.username}) }); alert('Xong'); changeSubject(); }
        async function submitAttendance() { const d = Array.from(document.querySelectorAll('.student-row')).map(r=>({student_id:r.dataset.id, is_absent:r.querySelector('.col-check input').checked?1:0, reason:r.querySelector('.txt-reason').value, proof_image_url:proofImages[r.dataset.id]})); await fetch('/api/data/attendance', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({subject_id:document.getElementById('subjectSelect').value, session_date:document.getElementById('todayDate').value, session_time:document.getElementById('sessionTime').value, learning_group:document.getElementById('groupSelect').value, attendance_data:d, current_user: currentUser.username}) }); alert('Đã lưu'); }
        async function handleProofUpload(id, inp) { const f=inp.files[0]; const fd=new FormData(); fd.append('proof',f); const r=await fetch('/api/data/upload-proof',{method:'POST',body:fd}); if(r.ok){ const d=await r.json(); proofImages[id]=d.url; displayProofPreview(id,d.url); } }
        function displayProofPreview(id, url) { document.getElementById(`proof-preview-${id}`).innerHTML = `<img src="${url}" onclick="window.open('${url}')">`; }
        function openAddStudentModal() { new bootstrap.Modal(document.getElementById('addStudentModal')).show(); }
        async function saveNewStudent() { await fetch('/api/data/students/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subject_id:document.getElementById('subjectSelect').value,students:[{mssv:document.getElementById('newStudentMSSV').value,full_name:document.getElementById('newStudentName').value,class_name:document.getElementById('newStudentClass').value}]})}); bootstrap.Modal.getInstance(document.getElementById('addStudentModal')).hide(); changeSubject(); }
        async function saveEditedStudent(){ await fetch(`/api/data/students/${document.getElementById('editStudentId').value}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name:document.getElementById('editStudentName').value,mssv:document.getElementById('editStudentMSSV').value,class_name:document.getElementById('editStudentClass').value,subject_id:document.getElementById('subjectSelect').value,learning_group:document.getElementById('editStudentGroup').value})}); bootstrap.Modal.getInstance(document.getElementById('editStudentModal')).hide(); changeSubject(); }
        async function deleteStudent(){ if(confirm('Xóa?')) await fetch(`/api/data/students/${document.getElementById('editStudentId').value}`,{method:'DELETE'}); bootstrap.Modal.getInstance(document.getElementById('editStudentModal')).hide(); changeSubject(); }
        function openAddSubjectModal() { document.getElementById('newSubjectName').value = ''; document.getElementById('newTeacherName').value = ''; const y = new Date().getFullYear(); const m = new Date().getMonth() + 1; const yStart = m >= 8 ? y : y - 1; document.getElementById('newYearStart').value = yStart; document.getElementById('newYearEnd').value = yStart + 1; const el = document.getElementById('addSubjectModal'); const modal = bootstrap.Modal.getOrCreateInstance(el); modal.show(); }
        async function saveNewSubject() { const body = { subject_name: document.getElementById('newSubName').value, teacher_name: document.getElementById('newTeacherName').value, school_year: `${document.getElementById('newYearStart').value}-${document.getElementById('newYearEnd').value}`, semester: document.getElementById('newSemester').value }; await fetch('/api/data/subjects', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) }); location.reload(); }
        function openEditSubjectModal() { const id = document.getElementById('subjectSelect').value; if(!id) return; const sub = allSubjects.find(s => s.id == id); document.getElementById('editSubjectName').value = sub.subject_name; new bootstrap.Modal(document.getElementById('editSubjectModal')).show(); }
        async function saveEditedSubject() { /* ... */ }
        async function deleteSubject() { /* ... */ }
        async function loadSavedAttendance() { /* ... (giữ nguyên logic fetch check) ... */ }

        init();
    </script>
