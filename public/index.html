<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Sinh Viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="auth.js"></script> 
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; padding-bottom: 60px; }
        .stat-card { border: none; border-radius: 15px; background: white; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.2s; }
        .stat-card:hover { transform: translateY(-3px); }
        .icon-box { width: 55px; height: 55px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; flex-shrink: 0; }
        
        .table-card { background: white; border-radius: 15px; padding: 0; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow: hidden; }
        .table-responsive { max-height: 60vh; overflow-y: auto; }
        
        /* [SỬA LỖI] Căn chỉnh cột dùng width % cố định cho cả TH và TD */
        .table { margin-bottom: 0; table-layout: fixed; width: 100%; min-width: 900px; /* Đảm bảo không bị co quá mức */ }
        .table thead th {
            position: sticky; top: 0; z-index: 10;
            background-color: #f8f9fa; border-bottom: 2px solid #dee2e6;
            font-weight: 700; color: #495057; text-transform: uppercase; font-size: 0.85rem;
            vertical-align: middle; padding: 12px 8px;
            box-shadow: 0 2px 2px -1px rgba(0,0,0,0.1);
        }
        .table tbody td { vertical-align: middle; padding: 12px 8px; word-wrap: break-word; }

        /* Định nghĩa độ rộng cột */
        .col-stt { width: 50px; text-align: center; }
        .col-name { width: 20%; text-align: left; padding-left: 15px !important; }
        .col-sub { width: 20%; text-align: left; }
        .col-date { width: 100px; text-align: center; }
        .col-sess { width: 80px; text-align: center; }
        .col-reason { width: 15%; text-align: left; }
        .col-proof { width: 80px; text-align: center; }
        .col-absent { width: 60px; text-align: center; }

        .badge-sub { background: #f8f9fa; border: 1px solid #dee2e6; color: #495057; border-radius: 6px; padding: 4px 8px; font-weight: 600; font-size: 0.85rem; display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .btn-action { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid #dee2e6; background: white; color: #6c757d; cursor: pointer; margin: 0 auto; }
        .alert-row { background-color: #fff5f5 !important; }
        .alert-row td:first-child { border-left: 5px solid #dc3545; }
        
        #btnScrollTop { position: fixed; bottom: 80px; right: 20px; width: 45px; height: 45px; background: #0d6efd; color: white; border: none; border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 1.2rem; z-index: 999; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <button id="btnScrollTop" onclick="window.scrollTo({top:0, behavior:'smooth'})"><i class="fas fa-arrow-up"></i></button>

    <nav class="navbar navbar-dark bg-primary mb-4 shadow-sm sticky-top">
        <div class="container">
            <span class="navbar-brand fw-bold fs-5"><i class="fas fa-user-shield"></i> DASHBOARD</span>
            <div class="d-flex align-items-center gap-2">
                <div class="text-white small text-end d-none d-md-block">
                    <div id="semesterDisplay">--</div><div id="yearHeaderDisplay" class="fw-bold text-warning">--</div> 
                </div>
                <div class="d-flex align-items-center text-white border-start border-white ps-3 ms-2">
                    <div class="text-end lh-1 me-2"><div class="fw-bold" id="userNameDisplay">--</div><div class="badge bg-warning text-dark" id="userRoleDisplay" style="font-size:0.6rem">--</div></div><i class="fas fa-user-circle fs-3"></i>
                </div>
                <div id="adminBtnArea"></div>
                <button class="btn btn-outline-light btn-sm" onclick="auth.logout()"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row mb-4 g-3">
            <div class="col-12 col-md-4"><div class="card stat-card h-100"><div class="card-body d-flex align-items-center"><div class="icon-box bg-primary bg-opacity-10 text-primary me-3"><i class="fas fa-users"></i></div><div><h6 class="text-muted small fw-bold">TỔNG SINH VIÊN</h6><h3 class="fw-bold mb-0" id="totalCount">--</h3></div></div></div></div>
            <div class="col-6 col-md-4"><div class="card stat-card h-100 border-start border-4 border-danger"><div class="card-body d-flex align-items-center p-3"><div class="icon-box bg-danger bg-opacity-10 text-danger me-2"><i class="fas fa-user-times"></i></div><div><h6 class="text-danger small fw-bold mb-0">SV CẢNH BÁO</h6><h3 class="fw-bold mb-0 text-danger fs-4" id="warningCount">--</h3></div></div></div></div>
            <div class="col-6 col-md-4"><div class="card stat-card h-100 border-start border-4 border-warning"><div class="card-body d-flex align-items-center p-3"><div class="icon-box bg-warning bg-opacity-10 text-warning-emphasis me-2"><i class="fas fa-book-dead"></i></div><div><h6 class="text-warning-emphasis small fw-bold mb-0">MÔN CẢNH BÁO</h6><h3 class="fw-bold mb-0 text-warning-emphasis fs-4" id="subWarningCount">--</h3></div></div></div></div>
        </div>

        <div class="d-flex flex-wrap gap-2 mb-3 align-items-center justify-content-between">
            <div class="d-flex gap-2 align-items-center flex-wrap">
                <select class="form-select form-select-sm w-auto fw-bold" id="yearFilter" onchange="render()"></select>
                <select class="form-select form-select-sm w-auto fw-bold bg-primary text-white" id="semFilter" onchange="render()"><option value="HK1">HK1</option><option value="HK2">HK2</option><option value="HK3">HK3</option></select>
                <div class="bg-white px-2 py-1 rounded border text-secondary small fw-bold">Vắng: <span class="text-danger" id="filterTotalCount">0</span></div>
                <input type="text" class="form-control form-control-sm w-auto" id="search" onkeyup="renderTable()" placeholder="Tìm kiếm...">
                <select class="form-select form-select-sm w-auto" id="subFilter" onchange="renderTable()"><option value="all">Tất cả môn</option></select>
            </div>
            <div>
                <a href="diemdanh.html" class="btn btn-primary btn-sm fw-bold"><i class="fas fa-pen-nib"></i> Điểm danh</a>
            </div>
        </div>

        <div class="table-card">
            <div class="table-responsive">
                <table class="table table-hover mb-0" id="mainTable">
                    <thead>
                        <tr>
                            <th class="col-stt">STT</th>
                            <th class="col-name">Họ và tên</th>
                            <th class="col-sub">Môn học</th>
                            <th class="col-date">Ngày</th>
                            <th class="col-sess">Buổi</th>
                            <th class="col-reason">Lý do</th>
                            <th class="col-proof">Ảnh</th>
                            <th class="col-absent">Vắng</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="proofModal"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-body text-center p-0"><img id="proofImg" class="img-fluid w-100"></div></div></div></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let idle=0; setInterval(()=>{idle++;if(idle>=15)auth.logout()},60000); window.onmousemove=()=>idle=0;
        window.onscroll = () => document.getElementById("btnScrollTop").style.display = window.scrollY > 300 ? "flex" : "none";

        let db = {}, currentUser = null, allSubjects = [];

        async function init() {
            const userStr = localStorage.getItem('user');
            if(!userStr) return window.location.href='login.html';
            currentUser = JSON.parse(userStr);
            document.getElementById('userNameDisplay').innerText = currentUser.fullName;
            document.getElementById('userRoleDisplay').innerText = currentUser.role.toUpperCase();
            if(currentUser.role === 'admin') document.getElementById('adminBtnArea').innerHTML = `<a href="quanly.html" class="btn btn-warning btn-sm"><i class="fas fa-cog"></i></a>`;

            try {
                let url = '/api/data/dashboard';
                // [SỬA LỖI] Lọc theo class chính xác
                if(currentUser.role !== 'admin') url += `?classFilter=${encodeURIComponent(currentUser.fullName)}`;

                const [resDb, resSub] = await Promise.all([fetch(url), fetch('/api/data/subjects')]);
                db = await resDb.json();
                allSubjects = await resSub.json();
                
                populateYear();
                render();
            } catch(e) { console.error(e); }
        }

        function populateYear() {
            const ySel = document.getElementById('yearFilter'); ySel.innerHTML = '<option value="all">Năm: Tất cả</option>';
            const years = [...new Set(allSubjects.map(s => s.school_year || '2024-2025'))].sort().reverse();
            years.forEach(y => ySel.add(new Option(y, y)));
            ySel.value = years[0] || 'all';
        }

        function render() {
            const sem = document.getElementById('semFilter').value;
            // Lưu semester để diemdanh.html dùng
            localStorage.setItem('currentSemester', sem); 
            
            const data = db[sem] || { total: 0, subjects: [], data: [] };
            
            document.getElementById('totalCount').innerText = db.globalTotal || 0;
            document.getElementById('semesterDisplay').innerText = `HK: ${sem}`;
            
            const subSel = document.getElementById('subFilter');
            const oldSub = subSel.value;
            subSel.innerHTML = '<option value="all">Tất cả môn</option>';
            data.subjects.forEach(s => subSel.add(new Option(s, s)));
            if(data.subjects.includes(oldSub)) subSel.value = oldSub;

            renderTable(data);
        }

        function renderTable(data) {
            // Nếu data không được truyền vào, lấy từ state
            if(!data) data = db[document.getElementById('semFilter').value] || { total: 0, subjects: [], data: [] };

            const tbody = document.getElementById('tableBody'); tbody.innerHTML = '';
            if(!data.data.length) { tbody.innerHTML = '<tr><td colspan="8" class="text-center py-4">Không có dữ liệu</td></tr>'; return; }

            const search = document.getElementById('search').value.toLowerCase();
            const subF = document.getElementById('subFilter').value;
            const yearF = document.getElementById('yearFilter').value;
            
            let stt = 1, warnCount = 0, subWarnSet = new Set(), displayCount = 0;

            data.data.forEach(sv => {
                if(search && !sv.name.toLowerCase().includes(search) && !sv.mssv.includes(search)) return;

                const details = sv.details.filter(d => (subF === 'all' || d.sub === subF) && (yearF === 'all' || d.school_year === yearF));
                if(details.length === 0) return;

                const subCount = {}; details.forEach(d => subCount[d.sub] = (subCount[d.sub]||0)+1);
                const isWarn = Object.values(subCount).some(c => c >= 2);
                
                if(isWarn) { warnCount++; Object.keys(subCount).forEach(s => { if(subCount[s]>=2) subWarnSet.add(s); }); }

                displayCount++;
                const rowSpan = details.length;
                const rowClass = isWarn ? 'alert-row' : '';

                details.forEach((d, i) => {
                    let html = `<tr class="${rowClass}">`;
                    if(i === 0) {
                        html += `<td rowspan="${rowSpan}" class="col-stt fw-bold text-muted">${stt++}</td>`;
                        html += `<td rowspan="${rowSpan}" class="col-name fw-bold ${isWarn?'text-danger':''}">${sv.name}<div class="small text-muted">${sv.mssv}</div></td>`;
                    }
                    html += `<td class="col-sub"><span class="badge-sub">${d.sub}</span></td>`;
                    html += `<td class="col-date small">${new Date(d.date).toLocaleDateString('vi-VN')}</td>`;
                    html += `<td class="col-sess small">${d.session_time}</td>`;
                    html += `<td class="col-reason small text-muted">${d.reason || '--'}</td>`;
                    html += `<td class="col-proof text-center">${d.proof ? `<button class="btn-action" onclick="viewProof('${d.proof}')"><i class="fas fa-eye"></i></button>` : ''}</td>`;
                    
                    if(i === 0) html += `<td rowspan="${rowSpan}" class="col-absent fw-bold ${isWarn?'text-danger':'text-success'}">${rowSpan}</td>`;
                    html += `</tr>`;
                    tbody.insertAdjacentHTML('beforeend', html);
                });
            });

            document.getElementById('warningCount').innerText = warnCount;
            document.getElementById('subWarningCount').innerText = subWarnSet.size;
            document.getElementById('filterTotalCount').innerText = displayCount;
        }

        function viewProof(url) { document.getElementById('proofImg').src = url; new bootstrap.Modal(document.getElementById('proofModal')).show(); }
        
        init();
    </script>
</body>
</html>
