<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sinh Viên</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <script src="auth.js"></script> 
    
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        .stat-card { border: none; border-radius: 15px; background: white; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.2s; }
        .stat-card:hover { transform: translateY(-3px); }
        .icon-box { width: 55px; height: 55px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-right: 15px; }
        .table-card { border-radius: 15px; overflow: hidden; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .table thead { background-color: #343a40; color: white; }
        .table th, .table td { padding: 15px; vertical-align: middle; }
        
        /* Hiệu ứng Edit Inline */
        .editable-cell { position: relative; padding-right: 30px; cursor: pointer; transition: background 0.2s; }
        .editable-cell:hover { background-color: #fff3cd; /* Màu nền vàng nhạt khi hover */ }
        
        /* Icon chỉnh sửa ẩn/hiện */
        .action-icon {
            visibility: hidden; opacity: 0; transition: all 0.2s; cursor: pointer;
            margin-left: 8px; font-size: 0.9rem;
        }
        /* Khi hover vào ô (td) thì hiện icon */
        .editable-cell:hover .action-icon, 
        .subject-cell:hover .action-icon { 
            visibility: visible; opacity: 1; 
        }

        .edit-pen { color: #0d6efd; }
        .delete-bin { color: #dc3545; }

        /* Animation */
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="fas fa-graduation-cap me-2"></i>Q.Lý Sinh Viên</a>
            <div class="d-flex align-items-center">
                <span class="text-white me-3 fw-bold" id="userDisplay">GV</span>
                <button class="btn btn-light btn-sm text-primary fw-bold" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>
    </nav>

    <div class="container pb-5 fade-in">
        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="stat-card p-3 d-flex align-items-center" onclick="window.location.href='diemdanh.html'" style="cursor: pointer;">
                    <div class="icon-box bg-primary text-white"><i class="fas fa-clipboard-check"></i></div>
                    <div><h6 class="text-muted mb-1">Điểm Danh</h6><h5 class="mb-0 fw-bold text-primary">Truy cập <i class="fas fa-arrow-right small"></i></h5></div>
                </div>
            </div>
            </div>

        <div class="card table-card">
            <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center flex-wrap gap-2">
                <h5 class="mb-0 fw-bold text-dark"><i class="fas fa-list-alt me-2 text-primary"></i>Danh Sách Cảnh Báo</h5>
                <div class="d-flex gap-2">
                    <select class="form-select form-select-sm fw-bold border-secondary text-primary" id="yearFilter" onchange="filterData()" style="width: 140px;">
                        <option value="all">Tất cả năm</option>
                    </select>
                    
                    <select class="form-select form-select-sm fw-bold border-primary" id="semFilter" onchange="filterData()" style="width: 100px;">
                        <option value="HK1">HK1</option><option value="HK2">HK2</option><option value="HK3">HK3</option>
                    </select>
                    
                    <select class="form-select form-select-sm" id="subFilter" onchange="filterData()" style="width: 160px;">
                        <option value="all">Tất cả môn</option>
                    </select>
                    
                    <button class="btn btn-success btn-sm fw-bold" onclick="exportExcel()"><i class="fas fa-file-excel"></i> Xuất</button>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0" id="mainTable">
                        <thead>
                            <tr>
                                <th>#</th><th>MSSV</th><th>Họ Tên</th><th>Lớp</th><th>Môn Học (Xóa vắng)</th><th>Vắng</th>
                                <th>Ngày Vắng</th><th>Lý Do (Sửa)</th><th>Minh Chứng</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="proofModal"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-body p-0"><img id="proofImg" src="" class="w-100 rounded"><div id="noProof" class="p-5 text-center text-muted" style="display:none">Không có minh chứng</div></div></div></div></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let rawData = []; 

        async function init() {
            await loadData();
        }

        async function loadData() {
            try {
                const res = await fetch('/api/data/dashboard'); 
                const data = await res.json();
                
                // Giả sử API trả về mảng chi tiết trong data.details hoặc chính là data
                // Nếu cấu trúc khác, bạn cần chỉnh lại dòng này
                rawData = Array.isArray(data) ? data : (data.details || []); 
                
                populateFilters();
                renderTable();
            } catch (e) { console.error("Lỗi tải data", e); }
        }

        function populateFilters() {
            // 1. Lọc và điền Năm học tự động từ dữ liệu
            const yearSet = new Set(rawData.map(r => r.school_year).filter(y => y)); // Lấy năm, bỏ null
            const yearSelect = document.getElementById('yearFilter');
            // Giữ lại option đầu tiên ("Tất cả năm")
            yearSelect.innerHTML = '<option value="all">Tất cả năm</option>';
            
            // Sắp xếp năm giảm dần
            const sortedYears = Array.from(yearSet).sort().reverse();
            sortedYears.forEach(y => yearSelect.add(new Option(y, y)));
            // Nếu có năm, chọn năm mới nhất làm mặc định (hoặc để all)
            if(sortedYears.length > 0) yearSelect.value = sortedYears[0];

            // 2. Điền Môn học
            const subFilter = document.getElementById('subFilter');
            subFilter.innerHTML = '<option value="all">Tất cả môn</option>';
            const subjects = [...new Set(rawData.map(r => r.subject_name))];
            subjects.forEach(s => subFilter.add(new Option(s, s)));
        }

        function filterData() { renderTable(); }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            const selYear = document.getElementById('yearFilter').value;
            const selSem = document.getElementById('semFilter').value;
            const selSub = document.getElementById('subFilter').value;

            const filtered = rawData.filter(item => {
                const matchYear = (selYear === 'all') || (item.school_year === selYear);
                const matchSem = (item.semester === selSem);
                const matchSub = (selSub === 'all') || (item.subject_name === selSub);
                return matchYear && matchSem && matchSub;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="text-center text-muted py-4">Không có dữ liệu cảnh báo</td></tr>';
                return;
            }

            filtered.forEach((row, index) => {
                // Format ngày dd/mm/yyyy
                const dateObj = new Date(row.session_date);
                const dateStr = `${String(dateObj.getDate()).padStart(2,'0')}/${String(dateObj.getMonth()+1).padStart(2,'0')}/${dateObj.getFullYear()}`;
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td class="fw-bold text-primary">${row.mssv}</td>
                    <td class="fw-bold">${row.full_name}</td>
                    <td>${row.class_name}</td>
                    
                    <td class="subject-cell">
                        ${row.subject_name} 
                        <i class="fas fa-trash-alt action-icon delete-bin" title="Xóa vắng (Tính là đi học)" 
                           onclick="removeAbsence(${row.record_id}, '${row.full_name}', '${row.subject_name}')"></i>
                    </td>
                    
                    <td class="text-danger fw-bold text-center">${row.absent_count || 1}</td>
                    <td>${dateStr} <br><small class="text-muted">(${row.session_time})</small></td>
                    
                    <td class="editable-cell" onclick="editReason(this, ${row.record_id})">
                        <span class="reason-text">${row.reason || '<i class="text-muted small">Chưa có</i>'}</span>
                        <i class="fas fa-pen action-icon edit-pen" title="Sửa lý do"></i>
                    </td>
                    
                    <td class="text-center">
                        ${row.proof_image_url ? `<button class="btn btn-outline-primary btn-sm rounded-pill" onclick="viewProof('${row.proof_image_url}')"><i class="fas fa-eye"></i></button>` : '-'}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // --- HÀM SỬA LÝ DO ---
        function editReason(td, recordId) {
            // Ngăn không cho tạo lại input nếu đang sửa
            if (td.querySelector('input')) return;

            const span = td.querySelector('.reason-text');
            const currentText = span.innerText === 'Chưa có' ? '' : span.innerText;
            
            // Xóa nội dung cũ
            td.innerHTML = '';

            // Tạo input
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'form-control form-control-sm d-inline-block w-75';
            input.value = currentText;
            
            // Tạo nút Lưu
            const saveBtn = document.createElement('button');
            saveBtn.className = 'btn btn-success btn-sm ms-1';
            saveBtn.innerHTML = '<i class="fas fa-check"></i>';
            saveBtn.onclick = (e) => {
                e.stopPropagation();
                saveReasonToDB(recordId, input.value, td);
            };

            td.appendChild(input);
            td.appendChild(saveBtn);
            input.focus();
            
            // Nếu click ra ngoài mà chưa lưu -> hủy bỏ (trả về cũ)
            input.addEventListener('blur', function(e) {
                // Dùng timeout để tránh xung đột với sự kiện click nút Save
                setTimeout(() => {
                    if(document.activeElement !== input && document.activeElement !== saveBtn) {
                         td.innerHTML = `<span class="reason-text">${currentText || '<i class="text-muted small">Chưa có</i>'}</span> <i class="fas fa-pen action-icon edit-pen"></i>`;
                    }
                }, 200);
            });
        }

        async function saveReasonToDB(id, newReason, td) {
            try {
                const res = await fetch('/api/data/attendance/update-reason', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ record_id: id, reason: newReason })
                });
                
                if (res.ok) {
                    // Cập nhật giao diện
                    td.innerHTML = `<span class="reason-text">${newReason || '<i class="text-muted small">Chưa có</i>'}</span> <i class="fas fa-pen action-icon edit-pen"></i>`;
                    // Cập nhật data trong RAM
                    const item = rawData.find(r => r.record_id === id);
                    if(item) item.reason = newReason;
                } else {
                    alert("Lỗi khi lưu!");
                }
            } catch (e) { alert("Lỗi kết nối!"); }
        }

        // --- HÀM XÓA VẮNG ---
        async function removeAbsence(id, name, sub) {
            if (confirm(`Xác nhận xóa vắng cho SV: ${name}\nMôn: ${sub}?`)) {
                try {
                    const res = await fetch('/api/data/attendance/remove-absence', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ record_id: id })
                    });
                    
                    if (res.ok) {
                        alert("Đã xóa vắng thành công!");
                        // Xóa dòng này khỏi bảng ngay lập tức
                        rawData = rawData.filter(r => r.record_id !== id);
                        filterData();
                    } else {
                        alert("Lỗi server!");
                    }
                } catch (e) { alert("Lỗi kết nối!"); }
            }
        }

        function viewProof(url) {
            new bootstrap.Modal(document.getElementById('proofModal')).show();
            document.getElementById('proofImg').src = url;
        }

        function exportExcel() {
            const table = document.getElementById("mainTable");
            const wb = XLSX.utils.table_to_book(table, {sheet: "Báo Cáo"});
            XLSX.writeFile(wb, "Danh_Sach_Canh_Bao.xlsx");
        }

        function logout() { localStorage.removeItem('isLoggedIn'); window.location.href = '/login/login.html'; }

        init();
    </script>
</body>
</html>
