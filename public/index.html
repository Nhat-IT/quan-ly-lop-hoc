<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sinh Viên</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <script src="auth.js"></script> 
    
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; padding-bottom: 60px; }
        
        .stat-card { border: none; border-radius: 15px; background: white; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.2s; }
        .stat-card:hover { transform: translateY(-3px); }
        .icon-box { width: 55px; height: 55px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; flex-shrink: 0; }
        
        .table-card { background: white; border-radius: 15px; padding: 0; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow: hidden; }
        
        /* Thanh cuộn dọc */
        .table-responsive { 
            max-height: 60vh; 
            overflow-y: auto; 
        }
        
        /* [QUAN TRỌNG] Cố định layout bảng */
        .table { margin-bottom: 0; table-layout: fixed; width: 100%; min-width: 1000px; }
        
        /* Sticky Header */
        .table thead th {
            position: sticky; top: 0; z-index: 10;
            background-color: #f8f9fa; border-bottom: 2px solid #dee2e6;
            font-weight: 700; color: #495057; text-transform: uppercase; font-size: 0.85rem;
            vertical-align: middle; padding: 12px 8px;
            box-shadow: 0 2px 2px -1px rgba(0,0,0,0.1);
        }
        .table tbody td { vertical-align: middle; padding: 12px 8px; word-wrap: break-word; font-size: 0.9rem; }

        /* [ĐÃ SỬA] Đặt class định danh cho từng cột để tránh lỗi lệch hàng khi rowspan */
        .col-stt { width: 50px; text-align: center; }
        .col-name { width: 220px; text-align: left; padding-left: 15px !important; }
        .col-sub { width: 200px; text-align: left; }
        .col-date { width: 110px; text-align: center; }
        .col-sess { width: 80px; text-align: center; }
        .col-reason { width: 180px; text-align: left; }
        .col-proof { width: 80px; text-align: center; }
        .col-absent { width: 80px; text-align: center; }

        .badge-sub { background: #f8f9fa; border: 1px solid #dee2e6; color: #495057; border-radius: 6px; padding: 4px 8px; font-weight: 600; font-size: 0.85rem; display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .btn-action { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid #dee2e6; background: white; color: #6c757d; cursor: pointer; margin: 0 auto; transition: 0.2s; }
        .btn-action:hover { background-color: #e9ecef; color: #0d6efd; }
        .alert-row { background-color: #fff5f5 !important; }
        .alert-row td:first-child { border-left: 5px solid #dc3545; }
        .editable-reason { cursor: pointer; position: relative; }
        .editable-reason:hover .edit-icon { opacity: 1; }
        .edit-icon { opacity: 0; color: #0d6efd; margin-left: 5px; transition: 0.2s; font-size: 0.8rem; }

        #btnScrollTop { position: fixed; bottom: 80px; right: 20px; width: 45px; height: 45px; background: #0d6efd; color: white; border: none; border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 1.2rem; z-index: 999; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: 0.3s; }
        #btnScrollTop:hover { transform: translateY(-3px); background-color: #0b5ed7; }
    </style>
</head>
<body>
    <button id="btnScrollTop" onclick="window.scrollTo({top:0, behavior:'smooth'})" title="Lên đầu trang"><i class="fas fa-arrow-up"></i></button>

    <nav class="navbar navbar-dark bg-primary mb-4 shadow-sm sticky-top">
        <div class="container">
            <span class="navbar-brand fw-bold fs-5"><i class="fas fa-user-shield"></i> DASHBOARD QUẢN LÝ LỚP</span>
            <div class="d-flex align-items-center gap-2">
                <div class="text-white small text-end d-none d-md-block">
                    <div id="semesterDisplay">--</div>
                    <div id="yearHeaderDisplay" class="fw-bold text-warning">--</div> 
                </div>
                <div class="d-flex align-items-center text-white border-start border-white ps-3 ms-2">
                    <div class="text-end lh-1 me-2">
                        <div class="fw-bold" id="userNameDisplay">--</div>
                        <div class="badge bg-warning text-dark" id="userRoleDisplay" style="font-size:0.6rem">--</div>
                    </div>
                    <i class="fas fa-user-circle fs-3"></i>
                </div>
                <div id="adminBtnArea"></div>
                <button class="btn btn-outline-light btn-sm" onclick="auth.logout()" title="Đăng xuất"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row mb-4 g-3">
            <div class="col-12 col-md-4"><div class="card stat-card h-100"><div class="card-body d-flex align-items-center"><div class="icon-box bg-primary bg-opacity-10 text-primary me-3"><i class="fas fa-users"></i></div><div><h6 class="text-muted small fw-bold">TỔNG SINH VIÊN</h6><h3 class="fw-bold mb-0" id="totalCount">--</h3></div></div></div></div>
            <div class="col-6 col-md-4"><div class="card stat-card h-100 border-start border-4 border-danger"><div class="card-body d-flex align-items-center p-3"><div class="icon-box bg-danger bg-opacity-10 text-danger me-2"><i class="fas fa-user-times"></i></div><div><h6 class="text-danger small fw-bold mb-0">SV CẢNH BÁO</h6><h3 class="fw-bold mb-0 text-danger fs-4" id="warningCount">--</h3></div></div></div></div>
            <div class="col-6 col-md-4"><div class="card stat-card h-100 border-start border-4 border-warning"><div class="card-body d-flex align-items-center p-3"><div class="icon-box bg-warning bg-opacity-10 text-warning-emphasis me-2"><i class="fas fa-book-dead"></i></div><div><h6 class="text-warning-emphasis small fw-bold mb-0">MÔN CẢNH BÁO</h6><h3 class="fw-bold mb-0 text-warning-emphasis fs-4" id="subWarningCount">--</h3></div></div></div></div>
        </div>

        <div class="d-flex flex-wrap gap-2 mb-3 align-items-center justify-content-between">
            <div class="d-flex gap-2 align-items-center flex-wrap">
                <select class="form-select form-select-sm w-auto fw-bold" id="yearFilter" onchange="render()"></select>
                <select class="form-select form-select-sm w-auto fw-bold bg-primary text-white" id="semFilter" onchange="render()">
                    <option value="HK1">HK1</option><option value="HK2">HK2</option><option value="HK3">HK3</option>
                </select>
                <div class="bg-white px-2 py-1 rounded border text-secondary small fw-bold shadow-sm">Vắng: <span class="text-danger" id="filterTotalCount">0</span></div>
                <input type="text" class="form-control form-control-sm w-auto" id="search" onkeyup="renderTable()" placeholder="Tìm tên, MSSV...">
                <select class="form-select form-select-sm w-auto" id="subFilter" onchange="renderTable()"><option value="all">Tất cả môn</option></select>
                <select class="form-select form-select-sm w-auto" id="statusFilter" onchange="renderTable()"><option value="all">Tất cả</option><option value="warning" class="text-danger fw-bold">🔴 Cảnh báo</option></select>
            </div>
            <div>
                <button class="btn btn-success btn-sm fw-bold me-1" onclick="exportExcel()"><i class="fas fa-file-excel"></i> Báo cáo</button>
                <a href="diemdanh.html" class="btn btn-primary btn-sm fw-bold" id="btnDiemDanh"><i class="fas fa-pen-nib"></i> Điểm danh</a>
            </div>
        </div>

        <div class="table-card">
            <div class="table-responsive">
                <table class="table table-hover mb-0" id="mainTable">
                    <thead>
                        <tr>
                            <th class="col-stt">STT</th>
                            <th class="col-name">Họ và tên</th>
                            <th class="col-sub">Môn học</th>
                            <th class="col-date">Ngày</th>
                            <th class="col-sess">Buổi</th>
                            <th class="col-reason">Lý do</th>
                            <th class="col-proof">Minh chứng</th>
                            <th class="col-absent">Vắng</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="8" class="text-center py-4 text-muted">Đang tải dữ liệu...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="proofModal"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-body text-center p-0"><img id="proofImg" class="img-fluid w-100"></div></div></div></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        window.onscroll = () => document.getElementById("btnScrollTop").style.display = window.scrollY > 300 ? "flex" : "none";

        let db = {}, allSubjects = [], currentUser = null;

        async function init() {
            const userStr = sessionStorage.getItem('user');
            if(!userStr) { window.location.href = 'login.html'; return; }
            currentUser = JSON.parse(userStr);
            
            if(document.getElementById('userNameDisplay')) document.getElementById('userNameDisplay').innerText = currentUser.fullName;
            if(document.getElementById('userRoleDisplay')) document.getElementById('userRoleDisplay').innerText = currentUser.role.toUpperCase();
            
            if(currentUser.role === 'admin') {
                const area = document.getElementById('adminBtnArea');
                if(area) area.innerHTML = `<a href="quanly.html" class="btn btn-warning btn-sm fw-bold"><i class="fas fa-cog"></i></a>`;
            }

            try {
                let url = '/api/data/dashboard';
                if(currentUser.role !== 'admin') url += `?classFilter=${encodeURIComponent(currentUser.fullName)}`;

                const [resDb, resSub] = await Promise.all([ fetch(url), fetch('/api/data/subjects') ]);
                if (!resDb.ok) throw new Error("API Dashboard lỗi");

                db = await resDb.json();
                if(resSub.ok) allSubjects = await resSub.json();
                
                populateYear();
                const savedSem = sessionStorage.getItem('currentSemester');
                if(savedSem && document.getElementById('semFilter')) document.getElementById('semFilter').value = savedSem;

                render(); 
            } catch(e) { 
                console.error(e);
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="8" class="text-center py-4 text-danger">Lỗi tải dữ liệu</td></tr>';
            }
        }

        function populateYear() {
            const ySel = document.getElementById('yearFilter');
            if(!ySel) return;
            ySel.innerHTML = '<option value="all">Năm: Tất cả</option>';
            const years = new Set(allSubjects.map(s => s.school_year || '2024-2025'));
            years.add('2024-2025');
            [...years].sort().reverse().forEach(y => ySel.add(new Option(y, y)));
            if(years.size > 0) ySel.value = [...years].sort().reverse()[0];
        }

        function render() {
            const sem = document.getElementById('semFilter').value;
            sessionStorage.setItem('currentSemester', sem);
            if(document.getElementById('btnDiemDanh')) document.getElementById('btnDiemDanh').href = `diemdanh.html?semester=${sem}`;

            const data = db[sem] || { total: 0, subjects: [], data: [] };
            
            if(document.getElementById('totalCount')) document.getElementById('totalCount').innerText = db.globalTotal || data.total || 0;
            if(document.getElementById('semesterDisplay')) document.getElementById('semesterDisplay').innerText = `HK: ${sem}`;
            
            const subSel = document.getElementById('subFilter');
            const oldSub = subSel.value;
            subSel.innerHTML = '<option value="all">Tất cả môn</option>';
            if(data.subjects) data.subjects.forEach(s => subSel.add(new Option(s, s)));
            if(data.subjects && data.subjects.includes(oldSub)) subSel.value = oldSub;

            renderTable(data);
        }

        function renderTable(data) {
            if(!data || !data.data) {
                const sem = document.getElementById('semFilter').value;
                data = db[sem] || { total: 0, subjects: [], data: [] };
            }

            const tbody = document.getElementById('tableBody'); 
            tbody.innerHTML = '';

            if(data.data.length === 0) { 
                tbody.innerHTML = '<tr><td colspan="8" class="text-center py-4 text-muted">Chưa có dữ liệu vắng.</td></tr>'; 
                updateStats(0, 0, 0);
                return; 
            }

            const search = document.getElementById('search').value.toLowerCase();
            const subF = document.getElementById('subFilter').value;
            const yearF = document.getElementById('yearFilter').value;
            const statusF = document.getElementById('statusFilter') ? document.getElementById('statusFilter').value : 'all';
            
            let stt = 1;
            let warnCount = 0;
            let subWarnSet = new Set();
            let displayCount = 0;

            data.data.forEach(sv => {
                if(search && !sv.name.toLowerCase().includes(search) && !sv.mssv.includes(search)) return;

                const details = sv.details.filter(d => (subF === 'all' || d.sub === subF) && (yearF === 'all' || d.school_year === yearF));
                if(details.length === 0) return;

                const subCount = {}; 
                details.forEach(d => subCount[d.sub] = (subCount[d.sub]||0)+1);
                const isWarn = Object.values(subCount).some(c => c >= 2);
                
                if(statusF === 'warning' && !isWarn) return;

                if(isWarn) { warnCount++; Object.keys(subCount).forEach(s => { if(subCount[s]>=2) subWarnSet.add(s); }); }
                displayCount++;

                const rowSpan = details.length;
                const rowClass = isWarn ? 'alert-row' : '';

                details.forEach((d, i) => {
                    let html = `<tr class="${rowClass}">`;
                    
                    // [QUAN TRỌNG] Gán class .col-* cho TD để khớp với TH
                    if(i === 0) {
                        html += `<td rowspan="${rowSpan}" class="col-stt fw-bold text-muted text-center">${stt++}</td>`;
                        html += `<td rowspan="${rowSpan}" class="col-name fw-bold ${isWarn?'text-danger':''}">${sv.name}<div class="small text-muted" style="font-weight:normal">${sv.mssv}</div></td>`;
                    }

                    html += `<td class="col-sub"><span class="badge-sub">${d.sub}</span></td>`;
                    html += `<td class="col-date small">${formatDateVN(d.date)}</td>`;
                    html += `<td class="col-sess small">${d.session_time || '-'}</td>`;
                    html += `<td class="col-reason small text-muted editable-reason" onclick="editReason(this, ${d.record_id})"><span class="reason-text">${d.reason || '<i class="text-muted small">--</i>'}</span><i class="fas fa-pen edit-icon"></i></td>`;
                    html += `<td class="col-proof text-center">${d.proof ? `<button class="btn-action btn-sm" onclick="viewProof('${d.proof}')"><i class="fas fa-eye"></i></button>` : ''}</td>`;
                    
                    if(i === 0) {
                        html += `<td rowspan="${rowSpan}" class="col-absent fw-bold ${isWarn?'text-danger':'text-success'}">${rowSpan}</td>`;
                    }
                    
                    html += `</tr>`;
                    tbody.insertAdjacentHTML('beforeend', html);
                });
            });

            updateStats(displayCount, warnCount, subWarnSet.size);
        }

        function updateStats(visible, warn, subWarn) {
            if(document.getElementById('filterTotalCount')) document.getElementById('filterTotalCount').innerText = visible;
            if(document.getElementById('warningCount')) document.getElementById('warningCount').innerText = warn;
            if(document.getElementById('subWarningCount')) document.getElementById('subWarningCount').innerText = subWarn;
        }

        function formatDateVN(d) {
            if(!d) return '-';
            const date = new Date(d);
            return isNaN(date) ? '-' : `${String(date.getDate()).padStart(2,'0')}/${String(date.getMonth()+1).padStart(2,'0')}/${date.getFullYear()}`;
        }

        function viewProof(url) { document.getElementById('proofImg').src = url; new bootstrap.Modal(document.getElementById('proofModal')).show(); }

        function editReason(td, id) {
            if(td.querySelector('input')) return;
            const span = td.querySelector('.reason-text');
            const currentText = span.innerText === '--' ? '' : span.innerText;
            td.innerHTML = `<input type="text" class="form-control form-control-sm" value="${currentText}" onblur="saveReason(this, ${id})">`;
            td.querySelector('input').focus();
        }

        async function saveReason(inp, id) {
            try {
                await fetch('/api/data/attendance/update-reason', {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({record_id: id, reason: inp.value})
                });
                init();
            } catch(e) { alert('Lỗi lưu'); }
        }

        function exportExcel() {
            const wb = XLSX.utils.table_to_book(document.getElementById('mainTable'), {sheet: "Data"});
            XLSX.writeFile(wb, "Report.xlsx");
        }
        
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
